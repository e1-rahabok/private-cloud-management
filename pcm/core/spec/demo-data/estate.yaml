# Synthetic ACME estate (pcm/core/design-notes/synthetic-acme-data.md). ACME is a global bank (D-065).
# The generator builds objects and history from this file, pcm/core/spec/demo-data/scenario-stories.yaml, a seed and "now" (D-067).
# Same inputs, same data.

version: 1
company: ACME Corp
industry: banking

regions:
  apj:  { name: Asia Pacific, vcf_operations_instance: vcf-ops-apj }
  amer: { name: Americas,     vcf_operations_instance: vcf-ops-amer }
  emea: { name: Europe,       vcf_operations_instance: vcf-ops-emea }

host_generations:
  current:  { cores: 64, threads: 128, memory_gb: 768, note: "2 x 32 cores, Hyper-Threading on", model: "Gen-2024, 2 x 32 cores", firmware: "BIOS 2.19", cores_per_numa_node: 32, memory_gb_per_numa_node: 384 }
  previous: { cores: 40, threads: 80,  memory_gb: 512, note: "2 x 20 cores, Hyper-Threading on", model: "Gen-2019, 2 x 20 cores", firmware: "BIOS 1.12", cores_per_numa_node: 20, memory_gb_per_numa_node: 256 }

# Host counts follow the mockup's location shares (28, 25, 22, 14, 11 percent of 1,200).
# London has the oldest fleet, for the hardware refresh PCM scenario story (C-5).
locations:
  sg:
    name: Singapore
    region: apj
    time_zone: Asia/Singapore
    financial_year_end_month: 12
    hosts: { current: 269, previous: 67 }
    procurement_lead_time_days: 120
  va:
    name: Virginia
    region: amer
    time_zone: America/New_York
    financial_year_end_month: 12
    hosts: { current: 210, previous: 90 }
    procurement_lead_time_days: 120
  fr:
    name: Frankfurt
    region: emea
    time_zone: Europe/Berlin
    financial_year_end_month: 12
    hosts: { current: 198, previous: 66 }
    procurement_lead_time_days: 120
  tk:
    name: Tokyo
    region: apj
    time_zone: Asia/Tokyo
    financial_year_end_month: 3
    hosts: { current: 126, previous: 42 }
    procurement_lead_time_days: 120
  ld:
    name: London
    region: emea
    time_zone: Europe/London
    financial_year_end_month: 12
    hosts: { current: 42, previous: 90 }
    procurement_lead_time_days: 120

# Cluster layout per location, by class of service. Host counts per cluster are spread
# evenly by the generator; every cluster has 1 HA host and 1 maintenance host held back
# from usable capacity (Capacity design, 3.2).
cluster_layout:
  share_of_hosts: { gold: 0.25, silver: 0.45, bronze: 0.20, mixed: 0.04, management: 0.04, edge: 0.02 }
  hosts_per_cluster: { min: 8, max: 16 }

vms:
  per_host_average: { gold: 7, silver: 28, bronze: 40, mixed: 20 }
  production_share: 0.6
  guest_os: { windows: 0.45, linux: 0.55 }

datastores:
  tb_per_host: 40
  average_tb: 64                       # for the datastore count in the detailed inventory

# Load pattern of a bank, in each location's local time (D-065).
load_pattern:
  online_day: { from: "08:00", to: "18:00" }
  end_of_day_batch: { from: "22:00", to: "03:00", note: "often the daily peak" }
  payday: { day_of_month: 25 }
  month_end_close: true
  quarter_end_close: true
  year_end_close: "location.financial_year_end_month"

# Realism rules the generator must follow (synthetic data design, section 3).
realism:
  contention_rises_only_near_saturation: true
  memory_consumed_high_is_normal: true
  bronze_runs_hotter_than_gold: true
  idle_means_idle_every_day: true
  mostly_green: true
  cluster_health_from_worst_vm_and_p90: true

# Cost model inputs (D-060). Per year, in USD. Product is already spread over
# value.depreciation_years.
cost:
  product: 24000000
  service: 6000000
  people: 9000000

# FinOps input (D-058): the same estate on public cloud over 5 years.
public_cloud_estimate:
  total_5y: 310000000
  as_of: "now - 40 days"
  owner: finops

procurement:
  next_round_closes: "now + 21 days"   # before SG-Silver's decision date, so an order in the round arrives in time
  round_interval_days: 182             # twice a year (SP5 capacity cadence)

recovery_plans:
  - { id: rp-sg, protected: sg, recovery: tk, target_minutes: 30 }
  - { id: rp-va, protected: va, recovery: va, target_minutes: 30, note: "second site in the same metro" }
  - { id: rp-fr, protected: fr, recovery: ld, target_minutes: 30 }
  - { id: rp-tk, protected: tk, recovery: sg, target_minutes: 30 }
  - { id: rp-ld, protected: ld, recovery: fr, target_minutes: 30 }

goals:
  - id: g-alerts
    title: Fewer urgent alerts
    metric: alerts.urgent_per_month
    target: 200
    direction: at_most
  - id: g-versions
    title: Software versions kept current
    metric: config.versions_current_percent
    target: 95
    direction: at_least
  - id: g-found-first
    title: Problems found before users notice
    metric: l2.found_by_check_percent
    target: 60
    direction: at_least

# The L2 inventory tree (l2.tree, D-087). The generator builds every host, VM and datastore from these rules
# and the cluster layout above; PCM scenario stories pin their named objects into the right place.
l2_tree:
  vcf_instance: "vcf-{loc}-01"
  workload_domains:
    management: { id: "wld-{loc}-mgmt", classes: [management, edge] }
    production: { id: "wld-{loc}-prod", classes: [gold, silver] }
    general:    { id: "wld-{loc}-gen",  classes: [bronze, mixed] }
  cluster_ids: "{LOC}-{letter}-{nn}; letters G, S, B, X for gold, silver, bronze, mixed (as the NOC), M management, E edge"
  host_ids: "{loc}-esx-{nnn}, numbered through the location in cluster order"
  vm_ids: "{loc}-{role}-{nnnn}; four digits, so generated names never meet a PCM scenario story's three-digit names"
  datastore_ids: "{LOC}-DS-{nn}, numbered through the location in cluster order"
  datastores_per_cluster: { gold: "VMFS on the array, 1 per 4 hosts", silver: "1 vSAN", bronze: "1 vSAN", mixed: "1 vSAN", management: "1 vSAN", edge: "1 vSAN" }
  previous_generation_hosts: "the location's previous-generation hosts fill its clusters from the last cluster of each class backwards; a cluster can mix both generations while a refresh runs"
  esxi_builds: { n: "9.0.2", n_minus_1: "9.0.1", n_minus_2: "8.0 U3" }
  esxi_build_rule: "current-generation hosts run N; previous-generation hosts run N-1; overrides below, then PCM scenario story pins"
  esxi_build_overrides: { VA-B-01: n_minus_2, VA-B-02: n_minus_2, LD-B-01: n }
  host_pins:
    note: "PCM scenario story hosts placed in their clusters (L-2, L-3, L-10, N-4, T-1, M-1). A pin swaps names with a generated host of that cluster."
    sg-esx-088: { cluster: SG-S-07 }
    va-esx-142: { cluster: VA-G-05 }
    ld-esx-201: { cluster: LD-B-01, esxi_build: n_minus_1 }
    ld-esx-202: { cluster: LD-B-01, esxi_build: n_minus_1 }
    ld-esx-203: { cluster: LD-B-01, esxi_build: n_minus_1 }
    sg-esx-031: { cluster: SG-G-02, generation: previous }
    sg-esx-035: { cluster: SG-G-02 }
    ld-esx-005: { cluster: LD-G-01, generation: current }
    ld-esx-077: { cluster: LD-G-01, generation: previous }
  ssh_hosts: { scenario_story: N-4, cluster: LD-S-01, first: 3 }
  datastore_pins: { SG-DS-11: SG-S-02, SG-DS-21: SG-G-02, LD-DS-03: LD-B-01, LD-DS-07: LD-S-01 }
  vm_pins:
    note: "PCM scenario story VMs and where they run. A VM a PCM scenario story names without a place runs in the location's first Silver cluster."
    fr-bat-017: { cluster: FR-S-02, class: bronze, role: bat, vcpu: 16 }
    fr-app-101: { cluster: FR-S-02 }
    fr-app-114: { cluster: FR-S-02 }
    fr-db-022: { cluster: FR-S-02 }
    fr-app-131: { cluster: FR-S-02 }
    sg-app-117: { cluster: SG-S-07, host: sg-esx-088, vcpu: 8, memory_gb: 32 }
    va-db-033: { cluster: VA-G-01 }
    sg-app-301: { cluster: SG-S-02, datastore: SG-DS-11 }
    sg-db-044: { cluster: SG-G-01, vcpu: 8 }
    ld-db-021: { cluster: LD-G-01, class: gold }
    tk-app-208: { cluster: TK-S-02 }
    tk-app-211: { cluster: TK-S-02 }
    sg-gl-db-01: { cluster: SG-G-02, host: sg-esx-031, datastore: SG-DS-21, vcpu: 24, memory_gb: 384 }
    ld-sql-014: { cluster: LD-G-01, host: ld-esx-077, vcpu: 24, memory_gb: 300 }
    va-fs-002: { cluster: VA-S-04, vcpu: 8 }
    va-jmp-001: { cluster: VA-B-01, vcpu: 2 }
  tools_versions: ["12.5", "12.4", "12.3", "12.1", "11.3"]
  vm_roles: [app, web, db, bat, fs, svc, mq, api]
  vm_vcpu: { gold: [4, 8, 16], silver: [2, 4, 8], bronze: [2, 4], mixed: [2, 4, 8] }
  appliances:
    per_location: [vcenter-mgmt, vcenter-wld, nsx-manager-1, nsx-manager-2, nsx-manager-3, nsx-edge-1, nsx-edge-2, sddc-manager]
    per_region: [vcf-operations, vcf-automation]
    region_home: { apj: sg, amer: va, emea: fr }
  vm_performance:
    note: "Mostly green (realism). A VM's base sits near its cluster's; about 1% of VMs sit in the yellow band and 3% just above the green line."
    window_spread: { "1h": 0, "24h": 1.5, "7d": 3, "30d": 4, "1y": 5 }

