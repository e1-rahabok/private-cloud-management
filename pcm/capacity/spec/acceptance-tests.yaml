# Acceptance tests for the Capacity workspace (D-070, section 4). Each test fixes its own clock (D-067).
version: 1
now: "2026-10-19T10:05:00+08:00"
seed: 7

catalog:
  - id: KCAT-1
    entry: capacity.planning_six_numbers
    given: { class: silver, cores: 64, base_ghz: 2.5, memory_gb: 768 }
    expect: { cpu_allocation: 28.5, cpu_reservation: 30.0, cpu_utilization: 28.5, mem_allocation: 26.4, mem_reservation: 44.0, mem_utilization: 25.88, binds: mem_utilization, matching_dram_gb: 839 }
    reason: "SP5 worked example: 25 VMs fit per host on 768 GB; memory utilization binds; the matching host has 839 GB."
  - id: KCAT-2
    entry: capacity.planning_six_numbers
    given: { class: gold, cores: 64, base_ghz: 2.5, memory_gb: 768 }
    expect: { matching_dram_gb: 520 }
  - id: KCAT-3
    entry: capacity.planning_six_numbers
    given: { class: bronze, cores: 64, base_ghz: 2.5, memory_gb: 768 }
    expect: { matching_dram_gb: 660 }
  - id: KCAT-4
    entry: capacity.usable
    given: { hosts: 24, clusters: 2, threads_per_host: 128, buffer_percent: 10 }
    expect: { compute_usable: 2304.0 }
    reason: "24 x 128 = 3,072; minus 2 HA and 2 maintenance hosts = 2,560; minus 10% buffer = 2,304."
  - id: KCAT-5
    entry: capacity.trend
    given: "a history with one close week far above the line"
    expect: { slope_unchanged_by_close_week: true }

scenario_story:
  - id: KST-1
    scenario_story: C-1
    expect: { group: SG-Silver, decision_days: 30, in_plan: true, round_on_time: true }
  - id: KST-2
    scenario_story: C-2
    expect: { group: TK-Gold, quadrant: waste }
  - id: KST-3
    scenario_story: C-3
    expect: { group: TK-Silver, peak_warning_month: 3, run_out_90d: null, purchase_decision_after_peak: true }
  - id: KST-4
    scenario_story: C-4
    expect: { group: FR-Silver, run_out_days_at_most: 200, in_plan: true, week_moved_earlier_because_of: dr-ocp-wave-2 }
  - id: KST-5
    scenario_story: C-5
    given: { location: ld, replace: 90, new: 75 }
    expect: { covers_next_year_growth: true, licensed_cores_before: 3600, licensed_cores_after: 4800 }
  - id: KST-6
    scenario_story: C-6
    expect: { group: SG-Silver, defers_next_round: true, cost_avoidance_equals_plan_total: true, powered_off_frees_memory_gb: 0 }
  - id: KST-7
    name: The check overrides the forecast (D-094)
    scenario_stories: [M-4, N-1]
    expect:
      LD-Bronze: { closed_for_new_vms: [LD-B-01] }
      FR-Silver: { closed_for_new_vms: [], note: "N-1: FR-S-02 is open at the check; its contention now is L2's and the NOC's" }
  - id: KST-8
    name: One definition with the CIO page
    expect: { rule: "Each location's decision on /api/exec/summary equals the earliest decision of its groups on /api/capacity/groups." }

page:
  - id: KPG-1
    rule: Every Capacity page and section names question, role and cadence.
  - id: KPG-2
    rule: No avoided word (pcm/capacity/spec/vocabulary.yaml) on any /capacity page.
  - id: KPG-3
    rule: On /capacity/clusters, TK-Gold is drawn in the waste colour, not green.
  - id: KPG-4
    rule: 'On /capacity/clusters, the LD-Bronze row says "Closed for new VMs" with LD-B-01; no row says "Full now" or "VMs waiting".'
  - id: KPG-5
    rule: /capacity shows FR-Silver moved earlier because of dr-ocp-wave-2.
  - id: KPG-6
    rule: No decision ID in page text; no request leaves the PCM host; text contrast at least 4.5:1.
