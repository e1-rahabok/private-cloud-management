    expect: { FR-S-02_score_1h_equals_noc_now: true, TK-S-03_noc_status: amber }
  - id: LST-3
    name: Monitor at the estate root, 24 hours
    scenario_stories: [N-1, N-4, L-3, C-1, C-6, L-7, M-2]
    expect:
      performance_status: red
      security_status: red
      first_finding_object: FR-S-02
      outcomes: { f-fr-s-02: problem, f-va-esx-142: improve, f-sg-silver-waste: improve, f-m2-other-wait: problem }
  - id: LST-4
    name: The 7-day window adds what a day cannot show, and never repeats a daily finding
    scenario_stories: [L-5, L-8, L-9, L-10, M-1, M-4]
    expect:
      kinds: { SG-DS-11: slow_drift, sg-db-044: hidden_in_average, va-db-033: hidden_in_average, LD-B-01: configuration_drift, ld: slow_drift, FR-B-04: heading_to_closed }
