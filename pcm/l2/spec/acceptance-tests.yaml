page:
  - id: LPG-1
    rule: Every L2 page and section names question, role and cadence.
  - id: LPG-2
    rule: No word from pcm/l2/spec/vocabulary.yaml "avoided" appears on any /l2 page.
  - id: LPG-3
    rule: The top bar shows Monitor, Troubleshoot and Improve, and apart from them the Agent E2 mark, Rules and Calendar; no Weekly, Monthly, Escalations, Configuration or Inventory item.
  - id: LPG-4
    rule: /l2 opens Monitor on the estate, Summary tab, 24 hours, with one row per pillar and no single combined score.
  - id: LPG-5
    rule: Selecting FR-S-02 in the tree keeps the activity and the window; switching to Troubleshoot keeps FR-S-02 selected.
  - id: LPG-6
    rule: Log complaint for sg-gl-db-01 opens a case page; "Propose the next link" adds links in the T-1 order; Rule out asks for a reason.
  - id: LPG-7
    rule: The case page for L-2 says "The cause is inside the Guest OS. Hand this evidence to the Windows or Linux team."
  - id: LPG-8
    rule: >
      Without the Agent E2 service running, the top bar mark is grey and named "Agent E2 is not available"; the mark on a case's
      header opens the panel, and a question sent there says "The Agent E2 service is not available" and shows no answer.
    decisions: [D-078, D-097]
  - id: LPG-9
    rule: Rules has no "Make automatic" button; "Propose a policy change" shows Publish disabled until Replay has run; threshold Publish is disabled until a replay.
    decisions: [D-079]
  - id: LPG-10
    rule: Group by host model on London's performance tab, 7 days, shows the Gen-2019 group with VMs below green.
  - id: LPG-11
    rule: Improve at the estate root shows the decision register; d-snapshots shows "Overdue".
  - id: LPG-12
    rule: No request leaves the PCM host; text contrast is at least 4.5:1.
  - id: LPG-13
    rule: No decision ID (D-nnn) appears in the visible text of any page of this workspace, in any state.
  - id: LPG-14
    rule: On the estate's Performance tab, VM comes before Cluster; Gold is selected; a click on the Actual slowness chart adds the time to the address and the clusters table is headed with that time.
    decisions: [D-091]
  - id: LPG-16
    rule: >
      Moving between pages does not load the page. A click on a tab, on the window, on a tree node and the browser's Back button change the address
      and the content, and a marker set on the page survives. The window is a drop-down that names the chosen window and lists five. No tab shows a status dot
      on a pillar page. The tab list has the tab role and exactly one selected tab; the panel is named by it.
    decisions: [D-093]
  - id: LPG-15
    rule: >
      A VM's Performance tab has the tabs Summary, Availability, Performance, Capacity, Security, Configuration in that order,
      no Inventory, no Group by and no side-by-side cards. Guest OS comes first and Virtual Motherboard under it, one chart per metric,
      with Now, Worst and the percentile figure. Every figure has its unit after the number and no name holds its unit or starts in lower case.
    decisions: [D-092]
  - id: LPG-17
    rule: >
      On LD-B-01's Capacity tab (7 days) the verdict comes first in words, then three charts in the order Cluster Consumption,
      Cluster Performance, Cluster Risk on one time axis with the closure levels drawn, then the check strip with 7 cells, the
      last one closed. Each chart has Now, Worst and the percentile figure, once each: the check value is not repeated beside the chart. No chart has an average line. Every capacity chip on the page has a finding row, or outside the 24-hour
      window a link to its daily finding, and "Nothing needs you under this object" is not shown.
    decisions: [D-094, D-095]
  - id: LPG-18
    rule: >
      No /l2 Capacity tab, on any object or window, shows a word from capacity_tab_avoided (pcm/l2/spec/vocabulary.yaml),
      except "imbalance" inside "CPU Imbalance"; above the cluster, none from capacity_group_avoided either. The tab has one
      sentence linking to the Capacity workspace, and no date or percentage read from it.
    decisions: [D-094, D-100]
  - id: LPG-19
    rule: >
      On wld-fr-gen's Capacity tab, Gold is selected and the page says there is no Gold cluster; a click on Bronze keeps the
      tab and the window; a click on the Consumption across clusters chart adds the time to the
      address and the clusters table is headed with that time; a click on FR-B-04 selects it in the tree and keeps the
      Capacity tab and the window.
    decisions: [D-091, D-094]
  - id: LPG-20
    rule: >
      Every L2 page shows the Agent E2 mark in the top bar, before Rules. On fr-svc-5526's Performance tab every metric has a mark named
      "Ask Agent E2 about {metric}"; every finding row has one, and no "Explain this finding" button remains. A click on the Peak vCPU run queue length mark
      opens the panel on the right: the content is pushed, not covered (the chart's right edge stays left of the panel), the tree folds to a strip,
      the Peak vCPU run queue length metric is outlined, the context names fr-svc-5526, Performance and the window, and up to three suggested questions show.
      With the service running, a suggested question returns an answer with a closed "Sources (2)" control, Agent E2's opening as the first paragraph with no box (the calculator's own lines not shown), an object of the
      estate named in it as a link, and the footer "recorded in the action history". A click on "Sources" opens it and shows the two files as chips.
      A move to another tab keeps the panel open with the new context; Esc closes it, the tree comes back, and the focus returns to the mark.
    decisions: [D-097, D-099, D-119]
  - id: LPG-22
    rule: >
      On fr-svc-5526's Performance tab each layer heading has a mark named "Ask Agent E2 about the {layer} layer"; it opens the panel
      with the layer in the context and suggests "Is the Guest OS layer the problem?". The top bar mark on the same tab suggests
      "Is this VM performing well over the last 24 hours?", and a question sent from it carries both layers' figures.
    decisions: [D-097]
  - id: LPG-23
    rule: >
      The KPI comes first (D-100). On fr-bat-6839's Performance tab the first section is "Performance" with Guest OS Performance
      then VM Performance, and neither layer repeats them. On FR-B-04's Performance tab the first charts are Cluster Performance and
      Cluster Risk, and no card "This object", "Trend" or "Children outside green" remains. Every figure of a 0 to 100% KPI is a band
      pill whose band matches its value and names it; its text is at least 4.5:1 on its background. A counter's figure has a pill only where the catalog has band ends (D-108): on a VM, every counter of the two KPIs (Peak vCPU run queue length, Peak disk queue length, Free memory, Memory page-out rate; the nine VM Performance sub-metrics); Context Switches has none. Free memory, higher is better, takes its band from lower limits. A metric title is on one line, in a row above the figures and chart; the Guest OS Performance and VM Performance cards have the same height.
      On fr-esx-244's Capacity tab the first section is the summary with Capacity Remaining, Time Remaining and VM Remaining, and
      says the values are placeholders from VCF Operations; then the verdict.
    decisions: [D-100, D-108]
  - id: LPG-24
    rule: >
      Details (D-106, D-108). On FR-B-04's Performance tab each of Cluster Performance and Cluster Risk has a fold named "Details" under its
      chart, closed when the page opens. Opened, Cluster Performance shows 9 charts and Cluster Risk 11, each at a readable width, one per
      part. Every part's figures carry the band of the catalog's band ends, and its chart shows the zones and a line in the band of each
      value. On an ESXi host (fr-esx-244) ESXi Performance has the same fold with 9 parts, banded the same way.
    decisions: [D-106, D-108]
  - id: LPG-25
    rule: >
      Charts keep their own height (D-108). On a cluster's Capacity tab no chart overlaps the heading, table or chart under it: the box of
      every chart is as tall as its drawing. The NOC wall's chart rules apply only inside the wall's panels.
    decisions: [D-108]
  - id: LPG-26
    rule: >
      On SG-S-01's Performance tab, Cluster Performance and Cluster Risk each have an Agent E2 mark named "Ask Agent E2 about {KPI}";
      on sg-esx-110's, ESXi Performance has one. The parts in a Details fold have none. A question from the Cluster Performance mark
      sends the KPI and its parts at the worst point. Every small mark is dark with white "E2", as the top bar mark, and has no status dot.
    decisions: [D-117]
  - id: LPG-21
    rule: >
      A clarifying answer shows its questions under "Agent E2 asks"; the next question sent carries the earlier turns. On a narrow screen
      (800 px) the panel covers the page as a sheet with Close at the top.
    decisions: [D-097]
  - id: LPG-28
    rule: >
      A second question in the same context carries the first as history: its question, and its answer as the person read it (the opening,
      then the text). No turn of the topic is dropped. PCM first asks Agent E2 for the topic decision with topic_choice auto
      (D-130); the answer request then goes with topic_choice continue. When Agent E2 says it continues, the answer shows
      "Continuing:" and the first question of the topic.
    decisions: [D-128, D-129, D-130]
  - id: LPG-29
    rule: >
      When Agent E2 starts a new topic, a "New topic" divider comes before the turn, and its next question carries only that topic's turns.
      "Continue the last topic instead" asks the same question again with topic_choice continue and the earlier topic's turns, and
      replaces the answer. "New topic" beside Ask makes the next question go with topic_choice new and no history. A suggested question
      goes with topic_choice new.
    decisions: [D-129]
  - id: LPG-30
    rule: >
      A question typed with a topic in progress: PCM asks Agent E2 for the topic decision first and shows it while the answer is written
      (the divider with "Continue the last topic instead", or "Continuing:" with "Start a new topic instead"); the answer request goes with
      topic_choice new or continue, as decided. A click on the button while waiting asks again with the other choice, and only that answer
      is kept. When Agent E2 gives no decision, the question continues the topic.
    decisions: [D-130]
