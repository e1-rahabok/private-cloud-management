name: PCM tests

# PCM's own unit tests and page tests on every pull request and every push to main (the workspace's test plan,
# section Test levels; RISK-7 in its brief). Every test_*.py under pcm/ and every pcm/<workspace>/tests/*.page.test.mjs
# runs, so a new test needs no change here. The lab tests run only on the author's laptop (CONSTRAINT-6).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Unit tests of every workspace
        run: python -m unittest discover -s pcm -t . -p "test_*.py"

  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright with Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Page tests of every workspace, one after the other
        run: |
          status=0
          for t in pcm/*/tests/*.page.test.mjs; do
            echo "::group::$t"
            node "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
