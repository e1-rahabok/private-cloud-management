# Settings: every threshold and target a page or model uses.
# No builder invents a threshold. Each one is here, with its default, its owner,
# and where the default comes from (spec README, rule 6).
# Defaults marked "mockup" come from the Executive Dashboard mockup and must be
# confirmed by the customer at install.

version: 1

settings:

  up.sla_percent:
    description: Availability SLA per class of service, per VM per calendar month, as Operational Availability (D-077).
    default: { gold: 99.975, silver: 99.95, bronze: 99.9 }
    unit: percent
    owner: l2
    source: "SP5 class-of-service, Recommended SLA per class"
    decisions: [D-077]

  up.kai_target_percent:
    description: Internal key availability indicator target.
    default: 100
    unit: percent
    owner: l2
    source: "SP5: availability is measured against no downtime; classes differ in how often they may miss it"
    decisions: [D-077]

  safe.certificate_warning_days:
    description: A certificate expiring within this many days is a risk, shown next to the Security SLA, not inside it. An expired certificate is unsecured time.
    default: 30
    unit: days
    owner: l2
    source: "SP5 object checks (private-cloud-explained): yellow at 1 to 30 days"
    decisions: [D-049]

  safe.sla_contract_percent:
    description: Security SLA in the contract, per VM per calendar month. The same for every class.
    default: 99.95
    unit: percent
    owner: l2
    source: "SP5 sla-metrics and class-of-service: contract value 99.95%, not 100%"
    decisions: [D-073]

  safe.ksi_target_percent:
    description: Internal key security indicator target.
    default: 100
    unit: percent
    owner: l2
    source: "SP5 sla-metrics: the internal KSI is 100%"
    decisions: [D-073]

  capacity.procurement_lead_time_days:
    description: Time from order to usable capacity, per location.
    default: 120
    unit: days
    owner: capacity
    source: "mockup: delivery takes about 4 months"
    per: location
    decisions: [D-054]

  capacity.decide_now_days:
    description: Decision date within this many days, and not in the next procurement round, shows red.
    default: 30
    unit: days
    owner: capacity
    source: "confirmed by the author"
    decisions: [D-054]

  capacity.decide_soon_days:
    description: Decision date within this many days, and not in the next procurement round, shows amber.
    default: 90
    unit: days
    owner: capacity
    source: "mockup: under 90 days act"
    decisions: [D-054]

  recovery.test_max_age_days:
    description: A recovery plan whose last test is older than this shows red.
    default: 365
    unit: days
    owner: l2
    source: "D-059 rationale: for example 12 months"
    decisions: [D-059]

  recovery.min_share_tested_percent:
    description: Below this share of protected VMs covered by the last test, the card shows amber.
    default: 95
    unit: percent
    owner: l2
    source: "confirmed by the author"
    decisions: [D-059]

  value.depreciation_years:
    description: Period over which product cost is spread, and the TCO period.
    default: 5
    unit: years
    owner: finops
    source: "Cost n Price n Value: do 5 years"
    decisions: [D-058, D-060]

  value.public_cloud_estimate:
    description: >
      FinOps input: the cost of running the same estate on public cloud over the
      depreciation period, component by component. Maintained as a data file in 1.0,
      because FinOps has no workspace yet.
    default: null
    unit: currency
    owner: finops
    source: "Cost n Price n Value, Private Cloud | Public Cloud"
    decisions: [D-058]

  value.currency:
    description: Currency shown on the Executive page.
    default: USD
    owner: finops
    source: mockup

  # ---------------------------------------------------------------- NOC (D-053 step 2)

  noc.rotation_seconds:
    description: Seconds each wall screen shows before the next.
    default: 60
    unit: seconds
    owner: l2
    source: "SP5 noc-live-screen: about 60 seconds per screen"
    decisions: [D-032, D-036]

  noc.refresh_seconds:
    description: How often the wall and desk read new data.
    default: 60
    unit: seconds
    owner: l2
    source: "SP5 noc-live-screen: refresh every minute, not every 10 minutes"

  noc.grouping_window_minutes:
    description: An alert joins an incident if raised within this many minutes of the incident's first alert.
    default: 5
    unit: minutes
    owner: l2
    source: "D-069 rationale: VM alerts within 5 minutes of their host's alert"
    decisions: [D-069]

  noc.unexpected_change_factor:
    description: A location's VM changes of one type are unexpected when the count is more than this many times the expected count.
    default: 3
    owner: l2
    source: "confirmed by the author"
    decisions: [D-036]

  noc.unexpected_change_min:
    description: And at least this many more than expected, so that 3 deletions against 1 expected is not red.
    default: 10
    owner: l2
    source: "confirmed by the author"
    decisions: [D-036]

  noc.shift_times:
    description: Start of the three shifts in each region's local time (D-031).
    default: { day: "07:00", evening: "15:00", night: "23:00" }
    owner: l2
    source: "confirmed by the author"
    decisions: [D-031]

  noc.actor_default:
    description: Prototype only. The operator name used when no sign-in exists. Real PCM takes it from single sign-on.
    default: "operator-1"
    owner: l2
    source: prototype

  # ---------------------------------------------------------------- PCM adapter (vCommunity, D-096)
  # Set in the adapter, never here: PCM reads what the adapter decided. Listed so every threshold has a name and an owner.

  adapter.cluster_check_period_hours:
    description: Length of each Periodic Cluster Check window, and how often it runs (l2.cluster_check).
    default: 24
    values: [1, 2, 4, 6, 8, 12, 24]
    unit: hours
    owner: l2
    set_in: "PCM adapter (vCommunity), Advanced Settings: Cluster Check Period"
    decisions: [D-094, D-096]

  adapter.cluster_check_time_utc:
    description: When one check window ends. The others end every period from it.
    default: "00:00"
    owner: l2
    set_in: "PCM adapter (vCommunity), Advanced Settings: Cluster Check Time"
    decisions: [D-094, D-096]

  adapter.cluster_check_worst_percent:
    description: The share of the window's worst samples the check ignores. 5 makes each check value the 95th percentile of its window; the page labels follow it (l2.statistics).
    default: 5
    range: [0, 50]
    unit: percent
    owner: l2
    set_in: "PCM adapter (vCommunity), Advanced Settings: Cluster Check Worst Percent"
    decisions: [D-095, D-096]

  adapter.cluster_closure_levels:
    description: The closure levels of the Periodic Cluster Check, on each KPI's health (the value, or 100 minus it when higher is worse). A value on a level does not reach it.
    default:
      performance: { red: "below 20", orange: "below 40" }
      risk: { red: "above 80", orange: "above 60" }
      consumption: { red: "above 80", orange: "above 60" }
    unit: score out of 100
    owner: l2
    set_in: "PCM adapter (vCommunity), periodic_cluster_check.py: CLOSE_RED_BELOW, CLOSE_ORANGE_BELOW"
    decisions: [D-094, D-096]

  # ---------------------------------------------------------------- Agent E2 (D-076)

  agent_e2.endpoint:
    description: "OpenAI-compatible endpoint of Agent E2's model. Demo: Vercel AI Gateway. Customer site: the local model server."
    default: "https://ai-gateway.vercel.sh/v1"
    owner: l2
    source: "D-076; Agent E2 harness/model_client.py"
    decisions: [D-017, D-076]

  agent_e2.model:
    description: The model. Demo default is one of Agent E2's local candidates, so the demo shows what a customer gets on site.
    default: "google/gemma-4-31b-it"
    owner: l2
    source: "Agent E2 benchmark/models.md, candidate list"
    decisions: [D-076]

  agent_e2.api_key_env:
    description: Name of the environment variable that holds the key. The key itself is never in the specification or the code.
    default: "AI_GATEWAY_API_KEY"
    owner: l2
    source: "Agent E2 harness/model_client.py"

  agent_e2.mode:
    description: "live: call the model. mock: a fixed draft, for tests that must not depend on the network."
    default: live
    owner: l2
    source: prototype

  # ---------------------------------------------------------------- L2 (D-053 step 3)

  l2.replay_days:
    description: Days of history a threshold change is replayed against before it is published.
    default: 30
    unit: days
    owner: l2

  l2.log_noise_max:
    description: A log message seen on healthy objects more often than this over the last 5 working days is noise, not a detection (l2.log_validation).
    default: 10
    unit: occurrences
    owner: l2
    source: "L2 design, 7.1"

  l2.log_noise_max:
    description: A log message seen on healthy objects more often than this over the last 5 working days is noise, not a detection (l2.log_validation).
    default: 10
    unit: occurrences
    owner: l2
    source: "L2 design, 5.9"

  agent_e2.service_url:
    description: "Agent E2 service (D-078): POST /v1/answer with question, facts and role; GET /v1/health. Answers 'why' questions from the knowledge base, with sources. The environment variable PCM_AGENT_E2_URL, when set, replaces it (a lab or a test points PCM at another service)."
    default: "http://127.0.0.1:8090"
    owner: l2
    source: "Agent E2 harness/answer_service.py"
    decisions: [D-078]

  # ---------------------------------------------------------------- Capacity (D-053 step 4)

  capacity.buffer_percent:
    description: Buffer after HA, per resource (SP5 supply).
    default: { compute: 10, memory: 0, storage: 10 }
    unit: percent
    owner: capacity
    source: "SP5 supply: typical 10% CPU and 0% memory; storage 10% proposal"
    decisions: [D-054]

  capacity.trend_weeks:
    description: Weekly peaks the trend is fitted on.
    default: 26
    owner: capacity
    source: "proposal; confirm with the author"

  capacity.purchase_cover_months:
    description: A purchase should keep the group within usable capacity this long after delivery.
    default: 12
    owner: capacity
    source: "proposal; confirm with the author (SP5: procurement twice a year)"

  capacity.waste_remaining_percent:
    description: Above this remaining capacity, with long time remaining, the group shows as waste (dark grey).
    default: 40
    owner: capacity
    source: "proposal; confirm with the author"

  capacity.waste_time_days:
    description: Time remaining above which high remaining capacity counts as waste.
    default: 365
    owner: capacity
    source: "proposal; confirm with the author"

  capacity.host_standard:
    description: The current host standard and its cost lines, per host (D-060, D-061). Set once a year.
    default: { cores: 64, threads: 128, memory_gb: 768, storage_tb: 40, server_usd: 32000, vcf_licence_usd_per_core_year: 150, support_usd_per_year: 2400 }
    owner: capacity
    source: "proposal: synthetic ACME figures; real figures come from vendor contracts (D-060)"
    decisions: [D-060, D-061]

  capacity.class_planning:
    description: SP5 planning values per class (typical VM, overcommit, reservation, expected concurrent peak) for the host specification.
    default:
      gold:   { vcpu: 16, gb: 64, cpu_overcommit: 1.0, mem_overcommit: 1.0, cpu_reservation: 0.50, mem_reservation: 1.00, cpu_peak: 0.35, mem_peak: 0.85 }
      silver: { vcpu: 8,  gb: 32, cpu_overcommit: 2.0, mem_overcommit: 1.2, cpu_reservation: 0.25, mem_reservation: 0.50, cpu_peak: 0.50, mem_peak: 0.85 }
      bronze: { vcpu: 4,  gb: 16, cpu_overcommit: 3.0, mem_overcommit: 1.4, cpu_reservation: 0.125, mem_reservation: 0.25, cpu_peak: 0.65, mem_peak: 0.85 }
    owner: capacity
    source: "SP5 class-of-service planning, Example implementation. Values the example does not fix (Gold CPU reservation and peak, Bronze overcommit and reservation) confirmed 2026-11-20."
    decisions: [D-061]

  capacity.planning_hypervisor:
    description: Planning-stage hypervisor share per host, and the system CPU reservation.
    default: { threads: 14, memory_gb: 64, system_reservation_ghz: 10 }
    owner: capacity
    source: "SP5 host specification: planning default 14 threads and 64 GB; 10 GHz system reservation"

