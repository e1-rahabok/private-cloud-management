# Settings: every threshold and target a page or model uses.
# No builder invents a threshold. Each one is here, with its default, its owner,
# and where the default comes from (spec README, rule 6).
# Defaults marked "mockup" come from the Executive Dashboard mockup and must be
# confirmed by the customer at install.

version: 1

settings:

  up.target_percent:
    description: Target for operational availability of production VMs.
    default: 99.95
    unit: percent
    owner: l2
    source: mockup
    decisions: [D-045]

  up.amber_margin_percent:
    description: Below target by at most this much shows amber; further below shows red.
    default: 0.05
    unit: percent
    owner: l2
    source: mockup

  safe.certificate_warning_days:
    description: A certificate expiring within this many days is a risk, shown next to the Security SLA, not inside it. An expired certificate is unsecured time.
    default: 30
    unit: days
    owner: l2
    source: "SP5 object checks (private-cloud-explained): yellow at 1 to 30 days"
    decisions: [D-049]

  safe.sla_contract_percent:
    description: Security SLA in the contract, per VM per calendar month. The same for every class.
    default: 99.95
    unit: percent
    owner: l2
    source: "SP5 sla-metrics and class-of-service: contract value 99.95%, not 100%"
    decisions: [D-073]

  safe.ksi_target_percent:
    description: Internal key security indicator target.
    default: 100
    unit: percent
    owner: l2
    source: "SP5 sla-metrics: the internal KSI is 100%"
    decisions: [D-073]

  capacity.procurement_lead_time_days:
    description: Time from order to usable capacity, per location.
    default: 120
    unit: days
    owner: capacity
    source: "mockup: delivery takes about 4 months"
    per: location
    decisions: [D-054]

  capacity.decide_now_days:
    description: Decision date within this many days, and not in the next procurement round, shows red.
    default: 30
    unit: days
    owner: capacity
    source: "confirmed by the author"
    decisions: [D-054]

  capacity.decide_soon_days:
    description: Decision date within this many days, and not in the next procurement round, shows amber.
    default: 90
    unit: days
    owner: capacity
    source: "mockup: under 90 days act"
    decisions: [D-054]

  recovery.test_max_age_days:
    description: A recovery plan whose last test is older than this shows red.
    default: 365
    unit: days
    owner: l2
    source: "D-059 rationale: for example 12 months"
    decisions: [D-059]

  recovery.min_share_tested_percent:
    description: Below this share of protected VMs covered by the last test, the card shows amber.
    default: 95
    unit: percent
    owner: l2
    source: "confirmed by the author"
    decisions: [D-059]

  value.depreciation_years:
    description: Period over which product cost is spread, and the TCO period.
    default: 5
    unit: years
    owner: finops
    source: "Cost n Price n Value: do 5 years"
    decisions: [D-058, D-060]

  value.public_cloud_estimate:
    description: >
      FinOps input: the cost of running the same estate on public cloud over the
      depreciation period, component by component. Maintained as a data file in 1.0,
      because FinOps has no workspace yet.
    default: null
    unit: currency
    owner: finops
    source: "Cost n Price n Value, Private Cloud | Public Cloud"
    decisions: [D-058]

  value.currency:
    description: Currency shown on the Executive page.
    default: USD
    owner: finops
    source: mockup

  # ---------------------------------------------------------------- NOC (D-053 step 2)

  noc.rotation_seconds:
    description: Seconds each wall screen shows before the next.
    default: 60
    unit: seconds
    owner: l2
    source: "SP5 noc-live-screen: about 60 seconds per screen"
    decisions: [D-032, D-036]

  noc.refresh_seconds:
    description: How often the wall and desk read new data.
    default: 60
    unit: seconds
    owner: l2
    source: "SP5 noc-live-screen: refresh every minute, not every 10 minutes"

  noc.grouping_window_minutes:
    description: An alert joins an incident if raised within this many minutes of the incident's first alert.
    default: 5
    unit: minutes
    owner: l2
    source: "D-069 rationale: VM alerts within 5 minutes of their host's alert"
    decisions: [D-069]

  noc.unexpected_change_factor:
    description: A location's VM changes of one type are unexpected when the count is more than this many times the expected count.
    default: 3
    owner: l2
    source: "proposal; confirm with the author"
    decisions: [D-036]

  noc.unexpected_change_min:
    description: And at least this many more than expected, so that 3 deletions against 1 expected is not red.
    default: 10
    owner: l2
    source: "proposal; confirm with the author"
    decisions: [D-036]

  noc.shift_times:
    description: Start of the three shifts in each region's local time (D-031).
    default: { day: "07:00", evening: "15:00", night: "23:00" }
    owner: l2
    source: "proposal; confirm with the author"
    decisions: [D-031]

  noc.actor_default:
    description: Prototype only. The operator name used when no sign-in exists. Real PCM takes it from single sign-on.
    default: "operator-1"
    owner: l2
    source: prototype

