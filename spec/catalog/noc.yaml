# Catalog entries read by the NOC workspace (design/noc-workspace.md).
# One number, one definition (PCM core, 1). Shared entries (safe.*, fast.*) live in executive.yaml
# and are reused here, so the wall and the CIO page can never disagree.

version: 1

entries:

  # ---------------------------------------------------------------- Screen status (D-041, D-036)

  noc.screen_status:
    description: The colour of one wall screen, and of its chip in the status strip.
    formula: >
      The worst status of the screen's tiles, among green, amber, red. If every tile's data is stale, the
      screen is no_data (grey). If some tiles are stale, those tiles are grey and the screen takes the
      worst of the others.
    note: "SP5 live screen: all green by default; red only for what L1 can act on the same day."
    decisions: [D-036, D-041]

  noc.red_unacknowledged:
    description: A screen has at least one red tile whose incident is not acknowledged. This pins the rotation.
    decisions: [D-041]

  # ---------------------------------------------------------------- 1. What changed? (inventory)

  noc.vm_changes:
    description: Per location and change type, VM changes in the last hour, planned ones left out.
    types: [created, deleted, powered_off, moved, resized]
    formula: "count(vm_change_event where planned = false, at >= now - 60 min) by location and type"
    decisions: [D-036]

  noc.vm_changes_expected:
    description: >
      The expected count for the same location, type and hour of the week: the average of the same hour in
      the last 4 weeks, plus planned work in the business calendar.
    decisions: [D-036]

  noc.changed_status:
    description: Status of one location and change type.
    status:
      red: "count > setting noc.unexpected_change_factor x expected, and count - expected >= setting noc.unexpected_change_min"
      green: "otherwise"
    note: "SP5: many VMs deleted while no deletion is planned means something is wrong. No amber: it is either expected or not."
    decisions: [D-036]

  # ---------------------------------------------------------------- 2. Is it up?

  noc.up_items:
    description: Per location, counts of availability findings now.
    parts:
      noc.vms_down_unplanned: "Production VMs powered off or not answering, outside a maintenance window"
      noc.hosts_not_responding: "ESXi hosts not responding or disconnected"
      noc.clusters_lost_ha: "Clusters that lost HA failover capacity"
      noc.management_down: "vCenter, NSX Manager, SDDC Manager or VCF Operations not answering"
      noc.datastores_unreachable: "Datastores in all-paths-down or permanent device loss"
    status:
      red: "any part > 0"
      green: "all parts are 0"
    note: "Down is always same-day work, so any down item is red."
    decisions: [D-036]

  # ---------------------------------------------------------------- 3. Is it fast?

  noc.cluster_performance:
    description: >
      Cluster Performance (%) per cluster, the latest 5-minute value, with the SP5 colour band. Built from
      the contention of its VMs: worst VM (depth) and 90th percentile (breadth).
    levels: "green 100-75, yellow 75-50, orange 50-25, red 25-0 (SP5 scoring)"
    status_on_wall:
      green: "green band"
      amber: "yellow band"
      red: "orange or red band"
    note: "The tile shows the score from 0 to 100, never raw counters (SP5: L1 needs 0-100 metrics)."
    decisions: [D-036, D-072]

  noc.villains:
    description: In a cluster that is not green, the VMs using the most of the contended resource in the last 5 minutes, top 5.
    decisions: [D-040]

  noc.victims:
    description: In a cluster that is not green, the VMs with the lowest VM Performance (%) in the last 5 minutes, top 5.

  # ---------------------------------------------------------------- 4. Is it safe? (reuses executive.yaml safe.findings)

  noc.safe_status:
    description: Status of one location on the "Is it safe?" screen.
    status:
      red: "safe.certificates_expired > 0"
      amber: "any other part of safe.findings > 0"
      green: "all parts are 0"
    note: >
      The wall shows open findings now; the monthly Security SLA (D-073) is not a wall number. An open
      finding is amber: L1 escalates it by SOP. An expired certificate is red: it can stop services the same day.
    decisions: [D-049, D-073]

  # ---------------------------------------------------------------- 5. Is it set right?

  noc.risky_changes:
    description: Configuration changes in the last hour that break the standard, high-risk settings only.
    examples:
      - "HA turned off on a cluster"
      - "DRS set to manual on a cluster"
      - "A VM given a CPU or memory limit outside the time-boxed limit action"
      - "A distributed switch MTU changed"
    status:
      red: "any count > 0"
      green: "0"
    note: "SP5: configuration alerts are for high-risk settings only. The rest goes to the daily check (D-039)."
    decisions: [D-036, D-039]

  # ---------------------------------------------------------------- Incidents (D-069)

  noc.grouping_rule:
    description: >
      An alert joins an open incident when its object's parent is the incident's root object (VM to host or
      cluster, host to cluster, VM to datastore) and it was raised within setting noc.grouping_window_minutes
      of the incident's first alert. Otherwise it opens a new incident on itself, or on its parent when the
      parent also alerts. Fixed rules, never the LLM.
    decisions: [D-069]

  noc.escalation_route:
    description: The L2 group an incident goes to, by root object type.
    routes:
      cluster: platform
      host: platform
      vm: platform
      datastore: storage
      distributed_switch: network
      nsx_edge: network
      vcf_operations_instance: platform
    decisions: [D-040]

  noc.escalation_evidence:
    description: >
      What PCM attaches to an escalation: the incident and its alerts; every SOP step run, with result;
      the VM owners of the villains and victims; their "on my court" values (VM: CPU Ready, Co-stop, Overlap,
      Other Wait, memory wait, swapped and ballooned, disk latency; cluster: Cluster Performance %).
    note: "The L1 exit criteria are the L2 entry criteria (SP5 People). L2 sees raw values; L1 does not."
    decisions: [D-040]

  noc.limit_expiry:
    description: >
      A time-boxed limit set by L1 expires at the end of the current shift, and PCM removes it then.
    note: >
      The end of the shift, not a fixed number of hours: the next shift should not inherit a limit it did
      not set. Forgotten limits cause contention months later (D-040).
    decisions: [D-040]

  noc.wall_finding:
    description: >
      When a wall screen turns red with no alert behind it (unexpected VM changes, risky configuration
      changes), PCM opens an incident of kind wall_finding on the location, with its SOP, so L1 can
      acknowledge it and the rotation can resume.
    sops: { changed: sop-unexpected-change, set_right: sop-risky-change }
    decisions: [D-041, D-075]
