# NOC vocabulary. L1 knows VM, host, cluster and datastore (design/noc-workspace.md, section 1).
# L1 gets scores from 0 to 100 and plain questions, not raw counters (SP5: raw counters need context).
# No cost or price (D-033). A page test scans all visible text of /noc pages, in every state.

version: 1
workspace: noc

allowed:
  - VM
  - virtual machine
  - host
  - cluster
  - datastore
  - vCenter
  - NSX Manager
  - SSH
  - lockdown mode
  - certificate
  - incident
  - escalate
  - SOP

avoided:
  # Raw counters belong to L2 (escalation evidence), not to L1 screens.
  - CPU Ready
  - Co-stop
  - Overlap
  - Other Wait
  - IOPS
  - latency
  - ms
  # No cost or price on the NOC (D-033).
  - cost
  - price
  - USD
  # Capacity planning is not a NOC job (SP5 live screen).
  - procurement
  - forecast

labels:
  changed: What changed?
  up: Is it up?
  fast: Is it fast?
  safe: Is it safe?
  set_right: Is it set right?
  no_data: No data
  in_hand: In hand
