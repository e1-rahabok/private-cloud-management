openapi: 3.1.0
info:
  title: PCM API, L2 part
  version: "3"
  description: >
    L2 endpoints (design/l2-workspace.md). Reads take the synthetic-only parameters now and enable, and where named
    view, window and activity. Writes go through the action engine (PCM core, 3.7) and the action history (D-063),
    with both identity fields (D-050).
paths:
  # ---------------------------------------------------------------- frame
  /api/l2/tree:
    get: { summary: "Query view, node (default estate), activity, pillar, window. The node, its path, and its children with status and open-case counts, sorted by activity (l2.tree). Below the cluster, children are returned as a list." }
  /api/l2/agent/health:
    get: { summary: "Whether the Agent E2 service answers its health check now (GET /v1/health, 2-second limit): available, model. Never cached longer than 30 seconds (D-097)." }
  /api/l2/agent/ask:
    post: { summary: "Ask Agent E2 (D-078, D-097). Body: question (required), context, turns (optional, the earlier turns of a clarifying round). context: kind (page, vm_layer, metric, kpi, finding, case, link, layer) with view, object, pillar, window, and as the kind needs metric, layer, finding, case, link. vm_layer is a layer of a VM's Performance tab (guest_os or virtual_motherboard); layer is a layer of a case. For page, the facts add every pillar's status and headline on Summary, and both layers' figures on a VM's Performance tab (frame.md, Agent E2 panel). PCM rebuilds the facts from the context on the server; numbers sent by the browser are ignored. Returns type (answer or clarify), content, questions, files_read, lead, computed, model, knowledge_commit, source (service; model_unavailable when the service answers 502 because its model cannot be reached; unavailable when there is no service), links (objects of the estate named in the content: name, id, view), label (the context in words), and the record with both identity fields (D-050). 400 without a question or with an unknown context; 404 for an object, metric, finding, case, link or layer that does not exist." }
  /api/l2/search:
    get: { summary: "Query q. Objects in any view whose name contains q, with kind and path. At most 20." }
  # ---------------------------------------------------------------- Monitor
  /api/l2/monitor/{view}/{object}/summary:
    get: { summary: "Query window. One row per pillar (l2.pillar_status), findings under the object, slipped alerts; at the estate root with window 1y, the twelve-month measures and repeated problems (l2.measures, l2.repeated_problems)." }
  /api/l2/monitor/{view}/{object}/{pillar}:
    get: { summary: "Query window, group_by; for performance also class (gold, silver, bronze, all; default gold) and at (an ISO time inside the window). The node summary, the iceberg, children worst first or grouped (l2.node_summary, l2.node_score, l2.iceberg, l2.slice_attributes), the pillar's content, and its findings. Performance on a VM adds layers: guest_os first, then virtual_motherboard, each with its status and, per metric, label, unit, points, now, worst (with its time) and percentile_95 (l2.realms); group_by is ignored there, and inventory is 404 on a VM, Guest OS, virtual disk or vNIC. Performance above the cluster adds perf: the VM section (l2.consumer_hits, l2.worst_vms) and the Cluster section (l2.provider_spread, l2.clusters_at). Capacity (D-094), class and at as for performance: on a cluster, and on a host, VM or Guest OS for their cluster with marked_host, it returns cluster: check (l2.cluster_check: state, since, checks_closed, rule, reason, period_hours, window_end, inputs each with value and percentile label), contention_now (l2.contention_now), kpis (l2.cluster_kpi_series: per KPI points, now, worst with its time, percentile_95, check_value, closure_levels), strip (one cell per check period in the window), parts (l2.consumption_parts), usable (l2.usable_capacity), spread (l2.host_spread), hosts (l2.capacity_hosts); above the cluster it returns group: class (default gold), closed (l2.closed_count), spread (l2.consumption_spread), near_closure (l2.near_closure), clusters_at (l2.capacity_clusters_at). Never a forecast, run-out date, decision date, capacity remaining or time remaining. 400 for an unknown class or a time outside the window." }
  /api/l2/inventory/{change}/expected:
    post: { summary: "Body: reason, required. The change then counts as explained by L2 (l2.change_explanation)." }
  # ---------------------------------------------------------------- Troubleshoot
  /api/l2/cases:
    get: { summary: "Query object (default estate), view. Cases under the object: open first, newest first (l2.case)." }
    post: { summary: "Open a case. Body: trigger complaint with vm, requester, symptom, since, and optional via, fine_until, already_checked (l2.complaint); or trigger finding with finding. 400 with the missing field named." }
  /api/l2/cases/{case}:
    get: { summary: "The case: header, trigger evidence, chain (l2.chain), layers (l2.layers), realms where the object is a VM (l2.realms), timeline (l2.timeline), who else (l2.who_else), closure." }
  /api/l2/cases/{case}/propose:
    post: { summary: "Agent E2 proposes the next link from its flows (D-089). Returns the link, or 'nothing more to propose'. Recorded with both identity fields." }
  /api/l2/cases/{case}/links/{link}/confirm:
    post: { summary: "L2 confirms a proposed link." }
  /api/l2/cases/{case}/links/{link}/rule-out:
    post: { summary: "L2 rules a proposed link out. Body: reason, required (400 otherwise)." }
  /api/l2/cases/{case}/accept:
    post: { summary: "Escalation only: L2 accepts the handover." }
  /api/l2/cases/{case}/reject:
    post: { summary: "Escalation only: L2 rejects the handover. Body: reason, required. Recorded as a gap in the SOP." }
  /api/l2/cases/{case}/draft:
    post: { summary: "Agent E2 drafts the root cause analysis from the confirmed links (task rca_draft). L2 vocabulary. Recorded (D-076)." }
  /api/l2/cases/{case}/close:
    post: { summary: "Body: root_cause, corrective_action, detection, detection_note. 400 if any is missing or no main link is confirmed (l2.case_close). For an escalation, the NOC incident closes with the same cause." }
  /api/l2/log-validation:
    get: { summary: "Query message. Count of the message on healthy objects over the last 5 working days, and whether it is noise (l2.log_validation)." }
  # ---------------------------------------------------------------- Improve
  /api/l2/improve/{view}/{object}/{pillar}:
    get: { summary: "Query window. Opportunities under the object, largest first (l2.opportunities); on Summary one row per pillar; at the estate root the decision register." }
  /api/l2/proposals/{id}/approve:
    post: { summary: "Approve a proposal. Counts toward its action type's record." }
  /api/l2/proposals/{id}/reject:
    post: { summary: "Reject. Requires a reason (400 without one): a rejection is data about the rule." }
  /api/l2/configuration:
    get: { summary: "Query object. Configuration opportunities in SP5 time order, each with fix the setting or fix the standard (l2.config_order)." }
  /api/l2/configuration/{id}/decide:
    post: { summary: "choice = fix_the_setting (creates a proposal, approval tier) or fix_the_standard (records a new standard version)." }
  /api/l2/decisions:
    get: { summary: "The decision register (l2.team_decision)." }
    post: { summary: "Record a decision: what, owner, due (YYYY-MM-DD), all required (400 otherwise)." }
  /api/l2/decisions/{id}/done:
    post: { summary: "Mark a decision done; records who and when." }
  # ---------------------------------------------------------------- Rules and Calendar
  /api/l2/rules/drafts:
    get: { summary: "Detections asked for by closed cases (l2.case_close)." }
  /api/l2/policies:
    get: { summary: "Action policies: tier, guardrails, version, owner, plus the record per action type as evidence (l2.action_policy, l2.action_record)." }
  /api/l2/policies/{type}/replay:
    post: { summary: "Body: proposed tier and guardrails. Replays them against recent history (l2.policy_replay). Changes nothing." }
  /api/l2/policies/{type}/publish:
    post: { summary: "Publish the proposed tier and guardrails as a new version, with a reason. Only after a replay. Then re-evaluates waiting proposals of that type: those that now pass run automatically, with no approval record (D-079)." }
  /api/l2/thresholds:
    get: { summary: "Thresholds L2 owns." }
  /api/l2/thresholds/{id}/replay:
    get: { summary: "Query value=<new value>. Alerts the current and the new value would have raised over l2.replay_days days." }
  /api/l2/thresholds/{id}/publish:
    post: { summary: "Publish a new value. Version increments; recorded in the action history." }
  /api/l2/calendar:
    get: { summary: "Business calendar entries." }
    post: { summary: "Add an entry. The next check reads it." }
