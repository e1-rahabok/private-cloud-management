# Acceptance tests for the Executive workspace (D-070, section 4).
# Three levels: catalog (maths), story (end to end with a fixed "now"), page (spec rules).
# Every test fixes its own clock (D-067). Dates are written relative to that "now".

version: 1
now: "2026-10-19T10:05:00+08:00"   # any fixed time works; stories are relative to it
seed: 7

catalog:

  - id: CAT-1
    entry: capacity.decision_date
    given: { run_out_date: "now + 150 days", procurement_lead_time_days: 120 }
    expect: "now + 30 days"

  - id: CAT-2
    entry: capacity.location_decision
    given:
      decision_dates: { SG-Silver.memory: "now + 30 days", SG-Gold.compute: "now + 200 days" }
      next_round_groups: [SG-Silver]
    expect: { date: "now + 30 days", resource: memory, in_plan: true, status: in_plan }

  - id: CAT-3
    entry: capacity.location_decision
    given:
      decision_dates: { VA-Bronze.compute: "now + 20 days" }
      next_round_groups: []
    expect: { status: red }

  - id: CAT-4
    entry: capacity.location_decision
    given:
      decision_dates: { VA-Bronze.compute: "now - 5 days" }
      next_round_groups: []
    expect: { status: red }
    reason: A date already past is red, not hidden.

  - id: CAT-5
    entry: safe.ksi_percent
    given: { vm_unsecured_minutes: [0, 0, 10], days_in_month: 31 }
    expect: { status: amber }
    reason: 10 minutes is within the 22.3-minute allowance of a 31-day month at 99.95%.

  - id: CAT-6
    entry: safe.ksi_percent
    given: { vm_unsecured_minutes: [0, 0, 480], days_in_month: 31 }
    expect: { status: red }
    reason: One VM over the allowance makes the card red, whatever the estate figure (D-073).

  - id: CAT-13
    entry: safe.ksi_percent
    given: { vm_unsecured_minutes: [0, 0, 0], days_in_month: 31 }
    expect: { status: green }

  - id: CAT-14
    entry: safe.vm_secured_time_percent
    given: { minutes_in_month_so_far: 26105, unsecured_minutes: 480, unsecured_inside_maintenance_window: 0 }
    expect: 98.16

  - id: CAT-15
    entry: safe.vm_secured_time_percent
    given: { minutes_in_month_so_far: 26105, unsecured_minutes: 480, unsecured_inside_maintenance_window: 480 }
    expect: 100.0
    reason: SSH on during the agreed maintenance window is agreed change, not a breach.

  - id: CAT-16
    entry: fast.production_kpi
    given: { class_group_kpi: { gold: 96.8, silver: 93.5, bronze: 88.2 } }
    expect: { status: green, order_kept: true }

  - id: CAT-17
    entry: fast.production_kpi
    given: { class_group_kpi: { gold: 90.0, silver: 92.0, bronze: 85.0 } }
    expect: { status: amber, order_kept: false }
    reason: All green, but Silver scores above Gold, so the price difference is not delivered.

  - id: CAT-18
    entry: fast.production_kpi
    given: { class_group_kpi: { gold: 80.0, silver: 70.0, bronze: 45.0 } }
    expect: { status: red, order_kept: true }
    reason: Bronze is in the orange band.

  - id: CAT-7
    entry: recovery.site_recovery
    given: { last_test_days_ago: 120, recovery_minutes: 22, target_minutes: 30, protected_vms: 1800, vms_in_test: 1580 }
    expect: { status: amber, share_tested_percent: 87.8 }

  - id: CAT-8
    entry: recovery.site_recovery
    given: { last_test_days_ago: 400, recovery_minutes: 20, target_minutes: 30, protected_vms: 100, vms_in_test: 100 }
    expect: { status: red }

  - id: CAT-9
    entry: value.public_cloud_comparison
    given: { cost_annual: 39000000, depreciation_years: 5, public_cloud_estimate: 310000000 }
    expect: { tco: 195000000, difference_percent: 37.1 }

  - id: CAT-10
    entry: goals.status
    given: { target: 95, direction: at_least, projected_year_end: 88 }
    expect: at_risk
    reason: Misses by 7, which is within 10% of the target (9.5).

  - id: CAT-11
    entry: up.availability_percent
    given: { vm_counted_minutes: [0, 15, 15], classes: [gold, silver, silver], days_in_month: 31 }
    expect: { status: amber }
    reason: 15 minutes is within Silver's 22.3-minute allowance for a 31-day month.

  - id: CAT-19
    entry: up.availability_percent
    given: { vm_counted_minutes: [0, 15], classes: [gold, gold], days_in_month: 31 }
    expect: { status: red }
    reason: 15 minutes exceeds Gold's 11.2-minute allowance.

  - id: CAT-20
    entry: up.sla_allowance_minutes
    given: { class: silver, days_in_month: 31 }
    expect: 22.32

  - id: CAT-21
    entry: up.vm_counted_downtime_minutes
    given: { downtime_minutes: 25, inside_approved_window_minutes: 25 }
    expect: 0
    reason: Downtime inside an approved change window does not count.

  - id: CAT-22
    entry: up.vm_counted_downtime_minutes
    given: { downtime_minutes: 25, inside_approved_window_minutes: 0, planned: true }
    expect: 25
    reason: Planned but outside an approved window still counts (SP5).

  - id: CAT-12
    entry: scale.compute_cores
    given: estate.yaml
    expect: 68280
    reason: "269x64 + 67x40 + 210x64 + 90x40 + 198x64 + 66x40 + 126x64 + 42x40 + 42x64 + 90x40"

story:

  - id: ST-1
    story: E-1
    expect:
      api: /api/exec/summary
      health.up.headline.status: amber
      health.up.vms_below_sla.value: 0
      health.fast.headline.status: green
      health.fast.order_kept: true
      health.safe.headline.status: red
      health.safe.vms_below_sla.value: 72
      health.safe.risk_certificates.value: 2
      health.safe.open_findings.ssh_or_shell_enabled.value: 3

  - id: ST-8
    story: E-1
    name: Estate KSI stays above the contract while the card is red
    expect:
      rule: health.safe.headline.value is at least 99.95 and below 100, and health.safe.headline.status is red.
    decisions: [D-073]

  - id: ST-2
    story: E-2
    expect:
      api: /api/exec/summary
      room_to_grow.estate_decision.location: sg
      room_to_grow.estate_decision.resource: memory
      room_to_grow.estate_decision.in_plan: true
      room_to_grow.estate_decision.date.days_from_now: 30
      room_to_grow.estate_decision.date.status: in_plan

  - id: ST-3
    story: E-3
    expect:
      api: /api/exec/value/site_recovery
      site_recovery[location=fr].status: amber
      site_recovery[location=fr].share_tested_percent.value: 87.8
      summary.value.site_recovery_status: amber

  - id: ST-4
    story: [E-4, C-6]
    expect:
      api: /api/exec/value/cost
      cost.cost_avoided_ytd.value: 1200000
      rule_cost_avoidable: "cost.cost_avoidable_next_round.value equals the SG-Silver total in capacity.purchase_plan"

  - id: ST-5
    story: E-5
    expect:
      api: /api/exec/summary
      goals[id=g-alerts].status: on_track
      goals[id=g-versions].status: at_risk
      goals[id=g-found-first].status: on_track

  - id: ST-6
    story: E-7
    enable: [E-7]
    expect:
      api: /api/exec/summary
      scale.locations[id=fr].stale: true
      scale.locations[id=ld].stale: true
      scale.locations[id=sg].stale: false

  - id: ST-7
    name: Same number in every place
    expect:
      rule: >
        capacity.location_decision for sg returned by /api/exec/summary, /api/exec/locations/sg
        and /api/exec/capacity is identical, including meta.definition_version.
    reason: One number, one definition (PCM core, 1).

  - id: ST-9
    story: [U-1, U-2]
    name: Actual availability counts the approved change window; operational does not
    expect:
      rule: health.up.actual_percent.value is below health.up.headline.value; health.up.headline.value is below 100; the up drill-down lists the Virginia event as not counted, with change CHG0041042.
    decisions: [D-077]

page:

  - id: PG-1
    rule: Every section of /exec has question, role and cadence in its spec header.
    source: spec/workspaces/executive/page.md
    decisions: [D-052]

  - id: PG-2
    rule: No word from catalog/vocabulary/executive.yaml "avoided" appears in the visible text of /exec, in any state.
    decisions: [D-051]

  - id: PG-3
    rule: The word "Live" does not appear in the header.
    decisions: [D-041]
    reason: Executive design, 4.2.

  - id: PG-4
    rule: With story E-7 on, the Frankfurt and London towers render in the stale colour with "No data", and no stale value is shown as a number.
    decisions: [D-041]

  - id: PG-5
    rule: The site recovery card's label is "Site recovery", and its drill-down shows "Backups are not included."
    decisions: [D-059]

  - id: PG-6
    rule: The word "saving" or "savings" does not appear anywhere on /exec.
    decisions: [D-060]

  - id: PG-7
    rule: The room-to-grow headline with status in_plan uses the in_plan chip ("In the plan"), not amber or red.
    decisions: [D-054]

  - id: PG-8
    rule: At most one drill-down panel per section is open at a time; each has a Close button.
    source: mockup rule

  - id: PG-9
    rule: Text contrast is at least 4.5:1, and every status colour has a text label.
    source: design-system/tokens.md

  - id: PG-10
    rule: >
      With the browser in time zone Asia/Singapore and now = 2026-10-19T10:05:00+08:00, the header
      shows "10:05" and names the zone (GMT+8 or SGT).
    decisions: [D-074]

  - id: PG-11
    rule: With story E-7 on, each estate meter shows "Excludes Frankfurt and London".
    decisions: [D-074]

  - id: PG-12
    rule: Loading /exec and opening every panel makes no request to any host other than the PCM host.
    decisions: [D-004, D-074]

  - id: PG-13
    rule: No decision ID (D-nnn) appears in the visible text of any page of this workspace, in any state.

