# Acceptance tests for the NOC workspace (D-070, section 4). Each test fixes its own clock (D-067).

version: 1
now: "2026-10-19T10:05:00+08:00"
seed: 7

catalog:

  - id: NCAT-1
    entry: noc.cluster_performance
    given: { scores: [94, 74.9, 49.9, 24.9] }
    expect: { wall_status: [green, amber, red, red] }
    reason: "SP5 bands: yellow is amber on the wall; orange and red are red."

  - id: NCAT-2
    entry: noc.changed_status
    given: { count: 40, expected: 2 }
    expect: red

  - id: NCAT-3
    entry: noc.changed_status
    given: { count: 3, expected: 1 }
    expect: green
    reason: Three times expected, but fewer than 10 more. Not worth a red.

  - id: NCAT-4
    entry: noc.grouping_rule
    given:
      alerts:
        - { id: a1, object: FR-S-02, object_type: cluster, raised: "now - 12 minutes" }
        - { id: a2, object: fr-app-101, parent: FR-S-02, raised: "now - 11 minutes" }
        - { id: a3, object: fr-app-114, parent: FR-S-02, raised: "now - 10 minutes" }
        - { id: a4, object: fr-app-140, parent: FR-S-02, raised: "now - 2 minutes" }
    expect: { incidents: 2, first_incident_alerts: [a1, a2, a3] }
    reason: a4 is 10 minutes after the first alert, outside the 5-minute window, so it opens its own incident.

  - id: NCAT-5
    entry: noc.escalation_route
    given: { root_object_type: datastore }
    expect: storage

  - id: NCAT-6
    entry: noc.limit_expiry
    given: { now_local: "10:05", shift_times: { day: "07:00", evening: "15:00", night: "23:00" } }
    expect: "15:00"

story:

  - id: NST-1
    story: N-1
    reason: N-3 is active too, so two screens are pinned; the wall cycles through both (D-041).
    expect:
      wall.strip[screen=fast].status: red
      wall.pins_contains: fast
      incidents[root_object=FR-S-02].alert_count: 4
      incidents[root_object=FR-S-02].severity: red
      incidents[root_object=FR-S-02].escalation_route: platform

  - id: NST-2
    story: N-1
    name: The SOP refuses a limit on a production villain, and allows stop provisioning
    expect:
      action: { name: time_boxed_limit, target: fr-bat-017, status: 403 }
      action_2: { name: stop_provisioning, target: FR-S-02, status: 200, history_has_both_fields: true }

  - id: NST-3
    story: N-1
    name: Acknowledging unpins the wall, and the chip shows In hand
    expect:
      after_ack_of: FR-S-02
      wall.pin: null
      wall.strip[screen=fast].status: red
      wall.strip[screen=fast].in_hand: true

  - id: NST-4
    story: N-1
    name: Close needs a root cause
    expect:
      close_without_cause: 400
      close_with_cause: 200

  - id: NST-5
    story: N-3
    expect:
      wall.strip[screen=changed].status: red
      incidents[root_object=tk].kind: wall_finding

  - id: NST-6
    story: N-2
    enable: [E-7]
    expect:
      wall.screens.up.tiles[location=fr].status: no_data
      wall.screens.up.tiles[location=ld].status: no_data
      incidents[root_object=vcf-ops-emea].severity: red

  - id: NST-7
    story: O-1
    expect:
      incidents[root_object=LD-DS-07].severity: orange
      incidents[root_object=LD-DS-07].escalation_route: storage
      orange_does_not_pin: true

  - id: NST-8
    name: Same safe numbers on the wall and the CIO page
    expect:
      rule: The London SSH count on the wall equals health.safe.open_findings.ssh_or_shell_enabled on /api/exec/summary.
    reason: One number, one definition (PCM core, 1).

  - id: NST-9
    name: An Agent E2 draft is recorded with both identity fields and never changes the incident
    expect: { record_action: agent_draft, actor_agent: agent-e2, actor_human_set: true, incident_state_unchanged: true }
    decisions: [D-050, D-076]

  - id: NST-10
    name: A draft that uses an avoided word is rewritten once, then replaced by the fixed template
    given: { model_answers: ["The cluster has high CPU Ready.", "Latency is high."] }
    expect: { source: fallback_vocabulary }
    decisions: [D-076]

  - id: NST-11
    name: Without a key or a reachable model, the page gets the fixed template, labelled
    expect: { source: fallback_unavailable }
    decisions: [D-076]

  - id: NST-12
    name: Agent E2 is told which actions were done, separately from the actions the SOP offers
    expect: { facts_have: [sop_steps, actions_already_done], sop_action_field: available_action }
    reason: "Found in the first live call: the model reported an available SOP action as done. The facts now keep the two apart."
    decisions: [D-076]

  - id: NST-13
    name: Agent E2 at the NOC desk gets L1's facts and L1's words
    given:
      cluster: { kind: cluster, cluster: FR-S-02 }
      step: { kind: step, incident: inc-fr-s-02, step: 0 }
      model_answers: ["Cluster FR-S-02 scores 22 out of 100.", "CPU Ready is high.", "Latency is high."]
    expect:
      role: l1
      cluster_facts: [score_now, villains, victims]
      step_facts: [sop_steps, actions_already_done, asked_about_step]
      clean_answer: { source: service }
      avoided_twice: { source: vocabulary, content: "", calls: 2 }
      recorded: { action: agent_ask, actor_agent: agent-e2 }
      unknown_context: 400
      unknown_incident: 404
    decisions: [D-050, D-098]

  - id: NST-14
    story: E-7
    reason: With Europe's VCF Operations stale, the banner counts leave out Frankfurt and London and name them; no stale location shows a number (D-106).
    expect:
      wall.scale.locations_without_data: [Frankfurt, London]
      wall.screens.capacity.tiles[location=fr].status: no_data
      wall.screens.capacity.tiles[location=ld].status: no_data

  - id: NST-15
    story: N-1
    reason: The one-hour chart has 13 points (every 5 minutes). The lowest line ends at FR-S-02 with 22; the average stays above 85, so the average alone would hide it (D-106).
    expect:
      wall.screens.fast.trend.points: 13
      wall.screens.fast.trend.lowest_now: [FR-S-02, 22.0]

  - id: NST-16
    story: none
    reason: Capacity has one tile per location with compute, memory and storage in use and days remaining; the tab order is up, fast, safe, changed, set_right, capacity (D-106).
    expect:
      wall.strip: [up, fast, safe, changed, set_right, capacity]


page:

  - id: NPG-9
    rule: >
      The incident page has no Agent E2 section; the mark on its title opens the panel, whose first suggestion is "Explain this incident".
      Pressing it shows a draft starting "Draft by Agent E2, to review", with the model and the person who asked.
    decisions: [D-076, D-098]

  - id: NPG-11
    rule: >
      Every desk page shows the Agent E2 mark in the top bar; the wall has none. Each Performance tile, the cluster drill-down, each
      alert row and each SOP step has a mark. A mark opens the panel on the right: the content is pushed, not covered. With the service
      running, an answer has a closed "Sources (n)" control; an answer that keeps an avoided word shows "Agent E2's answer used words that are not used on
      this screen" and no answer text. No avoided word appears in the panel in any state.
    decisions: [D-098, D-099]

  - id: NPG-1
    rule: Every NOC page and section names question, role and cadence.
  - id: NPG-2
    rule: No word from catalog/vocabulary/noc.yaml "avoided" appears on any /noc page, in any state.
  - id: NPG-3
    rule: /noc/wall has no button, link, input or select element.
  - id: NPG-4
    rule: With N-1 red and not acknowledged, the wall stays on Performance across several rotation periods.
  - id: NPG-5
    rule: After acknowledging on the desktop, the wall rotates again, and the Performance tab shows "In hand".
  - id: NPG-6
    rule: With E-7 on, the Frankfurt and London tiles are grey with "No data" and show no number.
  - id: NPG-7
    rule: "The incident page disables the limit button for the production villain and says: Production VM, escalate instead."
  - id: NPG-12
    rule: >
      The wall has the banner "ACME Corp Private Cloud" with Running VMs and Running ESXi hosts, six tabs in the order Availability,
      Performance, Security, Volatility, Configuration, Capacity, one active, and no screen title. No tab carries "Good", "Watch" or "Act now".
    decisions: [D-106]
  - id: NPG-13
    rule: >
      Performance shows a chart with two lines (average and lowest cluster) of 13 points; with E-7 on, the chart leaves out the clusters of the
      locations with no data and still draws.
    decisions: [D-106]
  - id: NPG-14
    rule: >
      Capacity shows five tiles with compute, memory and storage in use and the days remaining; with E-7 on the Frankfurt and London tiles are grey
      with "No data" and no number, and the banner counts exclude them and say so.
    decisions: [D-106]
  - id: NPG-8
    rule: No request leaves the PCM host; text contrast is at least 4.5:1 on the desktop pages and the wall.

  - id: NPG-10
    rule: No decision ID (D-nnn) appears in the visible text of any page of this workspace, in any state.

