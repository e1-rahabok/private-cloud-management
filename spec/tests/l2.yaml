  - id: LST-3
    story: L-3
    expect: { correct_it_count: 2, fix_setting_creates_proposal: true, fix_standard_increments_version: true }
  - id: LST-4
    story: L-4
    expect: { offered: true, without_reason: 400, with_reason: 200, tier_after: automatic, promoted_by_recorded: true }
  - id: LST-5
    story: [N-1, N-4, L-3, C-1, C-6, L-7]
