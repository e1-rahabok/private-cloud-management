    rule: Every L2 page and section names question, role and cadence.
  - id: LPG-2
    rule: No word from catalog/vocabulary/l2.yaml "avoided" appears on any /l2 page.
  - id: LPG-3
    rule: The daily page shows three separate verdict cards and no single combined score.
  - id: LPG-4
    rule: The escalation from the NOC shows on /l2/escalations after the NOC escalates it, with the villain's CPU Ready value.
  - id: LPG-5
    rule: The investigate page for sg-app-117 says the cause is inside the Guest OS.
  - id: LPG-6
    rule: Publish on the authoring page is disabled until a replay has run.
  - id: LPG-7
    rule: No request leaves the PCM host; text contrast is at least 4.5:1.

  - id: LPG-8
    rule: No decision ID (D-nnn) appears in the visible text of any page of this workspace, in any state.

  - id: LPG-9
    rule: Without the Agent E2 service running, "Ask Agent E2 why" on /l2/investigate/sg-app-117 says "The Agent E2 service is not available" and shows no answer.
    decisions: [D-078]

