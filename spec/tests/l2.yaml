# Acceptance tests for the L2 workspace (D-070, section 4). Each test fixes its own clock (D-067).
version: 1
now: "2026-10-19T10:05:00+08:00"
seed: 7

catalog:
  - id: LCAT-1
    entry: l2.daily_check
    given: { findings: [{ verdict: present_health, severity: red }, { verdict: risk, severity: amber }] }
    expect: { present_health: red, risk: amber, efficiency: green }
  - id: LCAT-2
    entry: l2.action_policy
    given:
      policy: { tier: automatic, guardrails: { max_vms_per_cluster_per_hour: 10, same_class_of_service_only: true, not_in_close_week: true } }
      runs:
        - { vms: 6, same_class: true, in_close_week: false, expect: run }
        - { vms: 12, same_class: true, in_close_week: false, expect: "stopped: max_vms_per_cluster_per_hour" }
        - { vms: 4, same_class: false, in_close_week: false, expect: "stopped: same_class_of_service_only" }
        - { vms: 4, same_class: true, in_close_week: true, expect: "stopped: not_in_close_week" }
    reason: Guardrails, not approvals, decide whether an automatic action runs (D-079).
  - id: LCAT-3
    entry: l2.threshold_replay
    given: { threshold: th-cluster-perf-red, current: 50, new: 60 }
    expect: { days: 30, new_at_least_current: true }

story:
  - id: LST-1
    story: L-1
    expect: { escalation_visible_after_noc_escalates: true, close_without_detection: 400, close_complete: 200 }
  - id: LST-2
    story: L-2
    expect: { realm_verdict: guest_os, vm_status: green, guest_os_status: red }
  - id: LST-3
    story: L-3
    expect: { correct_it_count: 2, fix_setting_creates_proposal: true, fix_standard_increments_version: true }
  - id: LST-4
    story: L-4
    expect:
      replay_would_run: 18
      replay_stopped: { max_vms_per_cluster_per_hour: 3, same_class_of_service_only: 1, not_in_close_week: 1 }
      publish_without_replay: 400
      publish_without_reason: 400
      tier_after: automatic
      version_after: 2
      proposal_state_after: ran_automatically
      accountable_after: "policy move_vms_between_clusters v2, owner l2-engineer-1"
      approval_recorded_after: false
  - id: LST-5
    story: [N-1, N-4, L-3, C-1, C-6, L-7]
    expect: { present_health: red, risk: amber, efficiency: amber, first_finding_verdict: present_health }
  - id: LST-6
    story: L-6
    expect: { explained_finding_last: true, explained_by_kind: quarter_end_close }
  - id: LST-7
    story: L-4
    expect: { reject_without_reason: 400 }
  - id: LST-8
    name: Same numbers as the NOC and the CIO
    expect: { rule: "The FR-S-02 score on /api/l2/daily equals the wall's FR-S-02 tile; the SSH finding count equals the CIO page's." }

page:
  - id: LPG-1
    rule: Every L2 page and section names question, role and cadence.
  - id: LPG-2
    rule: No word from catalog/vocabulary/l2.yaml "avoided" appears on any /l2 page.
  - id: LPG-3
    rule: The daily page shows three separate verdict cards and no single combined score.
  - id: LPG-4
    rule: The escalation from the NOC shows on /l2/escalations after the NOC escalates it, with the villain's CPU Ready value.
  - id: LPG-5
    rule: The investigate page for sg-app-117 says the cause is inside the Guest OS.
  - id: LPG-6
    rule: Publish on the authoring page is disabled until a replay has run.
  - id: LPG-7
    rule: No request leaves the PCM host; text contrast is at least 4.5:1.

  - id: LPG-8
    rule: No decision ID (D-nnn) appears in the visible text of any page of this workspace, in any state.

  - id: LPG-9
    rule: Without the Agent E2 service running, "Ask Agent E2 why" on /l2/investigate/sg-app-117 says "The Agent E2 service is not available" and shows no answer.
    decisions: [D-078]

  - id: LPG-10
    rule: The daily page has no "Make automatic" button; "Propose a policy change" shows Publish disabled until Replay has run.
    decisions: [D-079]

