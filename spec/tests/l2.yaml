    entry: l2.daily_check
    given: { findings: [{ verdict: present_health, severity: red }, { verdict: risk, severity: amber }] }
    expect: { present_health: red, risk: amber, efficiency: green }
  - id: LCAT-2
    entry: l2.offer_promotion
    given: [{ approvals: 23, rollbacks: 0, expect: true }, { approvals: 23, rollbacks: 1, expect: false }, { approvals: 12, rollbacks: 0, expect: false }]
  - id: LCAT-3
    entry: l2.threshold_replay
    given: { threshold: th-cluster-perf-red, current: 50, new: 60 }
    expect: { days: 30, new_at_least_current: true }

