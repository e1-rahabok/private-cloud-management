# Stories planted in the synthetic estate (design/synthetic-acme-data.md, section 5).
# Times are relative to "now" (D-067). Each story's expected results are tests in tests/.
# This file holds only the stories the Executive page needs (D-070, section 7).
# Other stories are added with their workspace.

version: 1

background:
  description: >
    Everything not in a story is mostly green (realism rule). No location other than the
    ones below has a decision date within 90 days. No VM is down outside U-1 and U-2.
    Fast: every class group KPI is green, and Gold scores above Silver above Bronze (D-072).
  fast.class_group_kpi: { gold: 96.8, silver: 93.5, bronze: 88.2 }
  capacity:
    note: >
      The forecast engine computes every run-out date (capacity.forecast). The background sets each location's
      trend run-out for its Silver memory, the tightest resource in this estate; other groups and resources run
      out later. Stories below change single groups.
    silver_memory_trend_run_out_days: { sg: 150, va: 340, fr: 330, tk: 470, ld: 370 }
    in_use_percent_now: { compute: 62, memory: 80, storage: 60 }
  l2:
    note: >
      The four L2 outcomes (L2 design, 2). Goals run in a straight line from their January value to the
      projected year-end of story E-5, so the monthly review and the CIO page read one projection.
    goal_january: { g-alerts: 320, g-versions: 72, g-found-first: 38 }
    week: { urgent_alerts: 46, repeated_escalations: 1, found_by_check_percent: 62, diagnose_known_minutes: 14 }
    last_week: { urgent_alerts: 49, repeated_escalations: 0, found_by_check_percent: 58, diagnose_known_minutes: 22 }
    diagnose_known_minutes_12m: [48, 44, 41, 39, 35, 31, 30, 26, 24, 22, 19, 16]
    slipped_alerts_12m: [14, 13, 13, 11, 12, 10, 9, 9, 8, 7, 6, 5]
    repeated_escalations_12m: [1, 1, 0, 2, 1, 1, 0, 1, 0, 1, 0, 1]
    repeated_escalations:
      - { type: class_mismatch, title: "Bronze VM placed in a Silver cluster", last_12m: 4, closed_by: null, story: N-1 }
      - { type: snapshot_left_by_backup, title: "Datastore filled by a snapshot a backup left behind", last_12m: 3, closed_by: "SOP added in May" }
      - { type: ntp_after_rebuild, title: "Host clock drifts after a rebuild", last_12m: 2, closed_by: null }

stories:

  C-1:
    title: Singapore Silver runs out of working memory
    objects: { cluster_group: SG-Silver, resource: memory }
    plant:
      memory_in_use_percent_now: 86
      trend_run_out: "now + 150 days"
      in_next_round: true
    expect:
      capacity.decision_date: "now + 30 days"
      capacity.location_decision(sg): { date: "now + 30 days", resource: memory, in_plan: true, status: in_plan }
      capacity.estate_decision: { location: sg }
    decisions: [D-054]

  C-6:
    title: Reclaimable capacity in Singapore Silver
    objects: { cluster_group: SG-Silver }
    plant:
      powered_off_vms: 300
      idle_vms: 900
      oversized_large_vms: 60
      reclaim_moves_decision_date_to: "now + 70 days"
    expect:
      value.cost_avoidable_next_round: "equals capacity.purchase_plan total for SG-Silver (one definition)"
    note: >
      Reclaiming moves SG-Silver's decision date past the following round, so this round's cost for
      that group could be avoided (D-060). Until it is done, C-1 stays in the plan.
    decisions: [D-060]

  E-4:
    title: Cost avoided earlier this year
    objects: { cluster_group: TK-Silver }
    plant:
      deferred_purchase:
        when: "now - 150 days"
        value_at_today_price: 1200000
    expect:
      value.cost_avoided_ytd: 1200000
    decisions: [D-060]

  N-4:
    title: SSH left on in London, outside the maintenance window
    objects: { location: ld, hosts: 3, production_vms_on_hosts: 72 }
    plant:
      ssh_enabled_since: "now - 8 hours"
      inside_maintenance_window: false
    expect:
      safe.ssh_or_shell_enabled: 3
      safe.vms_below_sla: 72
    note: >
      8 hours of unsecured time is far beyond the 21.6 minutes a month that 99.95% allows, so the 72
      production VMs on those hosts are below the Security SLA for the month (D-073).
    decisions: [D-049, D-073]

  E-1:
    title: Up is amber, fast is fine, safe is red because the contract broke for 72 VMs
    depends_on: [N-4, U-1, U-2]
    plant:
      certificates_expiring:
        - { component: vcenter-fr-01, expires: "now + 21 days" }
        - { component: nsx-manager-sg-01, expires: "now + 26 days" }
      certificates_expired: 0
      lockdown_off: 0
      root_logins_open: 0
    expect:
      up: { status: amber }
      fast: { status: green, headline_between: [88.2, 96.8], order_kept: true }
      safe: { status: red, vms_below_sla: 72, ksi_between: [99.95, 100.0], risk_certificates: 2, ssh_or_shell_enabled: 3 }
    note: >
      The estate KSI stays above 99.95%, yet the card is red: the rule is decided per VM (D-073). The 2
      certificates are a risk, not unsecured time, so they do not count against the SLA.
    decisions: [D-035, D-072, D-073]

  E-2:
    title: Singapore's date is already in the plan
    depends_on: [C-1]
    expect:
      headline_chip: in_plan
      headline_text_contains: ["working memory", "Singapore"]
    decisions: [D-054]

  E-3:
    title: Frankfurt site recovery not fully tested
    objects: { recovery_plan: rp-fr }
    plant:
      last_test: "now - 120 days"
      recovery_minutes: 22
      protected_vms: 1800
      vms_in_last_test: 1580
      other_plans: { last_test: "now - 60 days", recovery_minutes: 18, share_tested_percent: 99 }
    expect:
      recovery.site_recovery(fr): { status: amber, share_tested_percent: 87.8 }
      card_status: amber
    decisions: [D-059]

  E-5:
    title: Goals, one at risk
    plant:
      g-alerts: { projected_year_end: 180 }
      g-versions: { projected_year_end: 88 }
      g-found-first: { projected_year_end: 64 }
    expect:
      g-alerts: on_track
      g-versions: at_risk
      g-found-first: on_track
    decisions: [D-043]

  E-6:
    title: Delivery speed
    plant:
      delivery_hours_last_30d: 3.8
      delivery_hours_year_ago: 264
    expect:
      speed.delivery_time: { now: 3.8, year_ago: 264 }

  E-7:
    title: Europe's VCF Operations goes stale
    enabled_by_default: false
    objects: { vcf_operations_instance: vcf-ops-emea }
    plant:
      last_successful_read: "now - 20 minutes"
      collection_cycle_minutes: 5
    expect:
      locations: { fr: { stale: true }, ld: { stale: true } }
      header_text_contains: "Some data is out of date"
    note: >
      Off by default, so the other stories read Frankfurt and London normally. Tests and
      demos switch it on. Same failure as NOC story N-2. On the Executive page, Frankfurt and London towers turn
      grey with "No data"; they are never drawn as healthy (D-041).
    decisions: [D-041]

  # ---------------------------------------------------------------- NOC stories (D-053 step 2)

  N-1:
    title: A Bronze batch VM in a Silver cluster hurts its neighbours in Frankfurt
    objects:
      cluster: FR-S-02
      villain: { vm: fr-bat-017, class: bronze, environment: production }
      victims: [fr-app-101, fr-app-114, fr-db-022, fr-app-131]
    plant:
      cluster_performance:
        before: { value: 94, until: "now - 20 minutes" }
        now: 22
        shape: linear fall
      villain_score: 88
      victim_scores: [31, 36, 41, 44]
      alerts:
        - { object: FR-S-02, object_type: cluster, severity: red, title: "Cluster not serving its VMs well", raised: "now - 12 minutes" }
        - { object: fr-app-101, object_type: vm, parent: FR-S-02, severity: red, title: "VM waiting for resources", raised: "now - 11 minutes" }
        - { object: fr-app-114, object_type: vm, parent: FR-S-02, severity: red, title: "VM waiting for resources", raised: "now - 10 minutes" }
        - { object: fr-db-022, object_type: vm, parent: FR-S-02, severity: red, title: "VM waiting for resources", raised: "now - 9 minutes" }
    expect:
      wall.fast.status: red
      wall.pins_contains: fast
      incident: { root_object: FR-S-02, alerts: 4, severity: red, sop: sop-cluster-contention, escalation_route: platform }
      sop.limit_allowed: false
      sop.limit_refusal: "Production VM: escalate instead"
      sop.stop_provisioning_allowed: true
    note: >
      The villain is production, so the SOP escalates to L2 instead of limiting it (D-040). Stopping
      provisioning on the cluster is still allowed: it touches no running VM.
    decisions: [D-040, D-041, D-069]

  N-2:
    title: Europe's VCF Operations stops answering
    enabled_by_default: false
    same_as: E-7
    expect:
      wall.tiles: { fr: no_data, ld: no_data }
      incident: { root_object: vcf-ops-emea, severity: red, sop: sop-no-data, escalation_route: platform }
    note: "A grey screen is itself escalated (D-041). Frankfurt's contention (N-1) is hidden while Europe is grey: correct, the wall shows only what it knows."
    decisions: [D-041]

  N-3:
    title: 40 VMs deleted in Tokyo with no change planned
    objects: { location: tk }
    plant:
      deleted_last_hour: 40
      deleted_within: "now - 10 minutes"
      expected_deleted: 2
      planned: false
      by: "svc-decom@tk.acme.internal"
      via: "vCenter API"
    expect:
      wall.changed.tk.deleted.status: red
      incident: { root_object: tk, kind: wall_finding, severity: red, escalation_route: platform }
    note: >
      Inventory changes raise no alert (SP5). But every red on the wall must be something L1 can acknowledge
      (D-041), so PCM opens a wall-finding incident for it (D-075).
    decisions: [D-036, D-041, D-075]

  O-1:
    title: Datastore space running low in London
    objects: { datastore: LD-DS-07, location: ld }
    plant:
      alerts:
        - { object: LD-DS-07, object_type: datastore, severity: orange, title: "Datastore space running low", raised: "now - 95 minutes" }
    expect:
      incident: { root_object: LD-DS-07, severity: orange, sop: sop-datastore-space, escalation_route: storage }
      wall.pin_effect: none
    note: "Orange is end-of-day work. It appears in the alert list but does not stop the wall rotation."
    decisions: [D-040]

  # ---------------------------------------------------------------- L2 stories (D-053 step 3)

  L-1:
    title: The Frankfurt escalation arrives at L2 complete, and closes only with a detection decision
    depends_on: [N-1]
    flow: "NOC escalates inc-fr-s-02 (NOC page or API), then L2 reads it on /l2/escalations"
    expect:
      escalation: { id: inc-fr-s-02, evidence_has: [sop_steps, villains, victims, l1_actions], villain_counters_shown: true }
      close_without_detection: 400
      close_complete: 200
    note: "L2 sees raw counters of the villain and victims; L1 did not (NOC vocabulary)."
    decisions: [D-040, D-050]

  L-2:
    title: An application owner says SG-APP-117 is slow; the cause is inside the Guest OS
    objects: { vm: sg-app-117, cluster: SG-S-07, host: sg-esx-088 }
    plant:
      vm: { cpu_ready_percent: 0.6, co_stop_percent: 0.1, memory_wait_percent: 0.0, disk_latency_ms: 3, vm_performance: 96 }
      guest_os: { run_queue_per_vcpu: 6.5, context_switches_per_s: 41000, paging_per_s: 12, guest_os_performance: 38 }
    expect:
      first_failing_step: null
      realm_verdict: guest_os
    decisions: [D-038]

  L-3:
    title: One host in VA-G-05 drifted from its peers
    objects: { host: va-esx-142, cluster: VA-G-05 }
    plant:
      drift:
        - { setting: ntp_server, actual: "10.20.1.9", standard: "ntp.acme.internal" }
        - { setting: syslog_target, actual: "(none)", standard: "loginsight.acme.internal" }
    expect: { group: correct_it, findings: 2 }

  L-4:
    title: A VM move becomes automatic by a policy change, not by a count of approvals
    plant:
      proposal: { id: p-move-sg-s-04, action_type: move_vms_between_clusters, from: SG-S-04, to: SG-S-06, vms: 6, same_class: true, in_close_week: false }
      record: { action_type: move_vms_between_clusters, approvals: 23, rejections: 1, rollbacks: 0 }
      history:
        note: "The 23 approved moves of the last 30 days, as the replay reads them"
        moves: 23
        more_than_10_vms: 3
        across_classes: 1
        in_close_week: 1
      proposed_policy: { tier: automatic, guardrails: { max_vms_per_cluster_per_hour: 10, same_class_of_service_only: true, not_in_close_week: true } }
    expect:
      no_make_automatic_button: true
      replay: { would_run_automatically: 18, stopped: { max_vms_per_cluster_per_hour: 3, same_class_of_service_only: 1, not_in_close_week: 1 } }
      publish_without_replay: 400
      publish_without_reason: 400
      after_publish: { tier: automatic, version: 2, owner: l2-engineer-1 }
      waiting_proposal_after_publish: { state: ran_automatically, approval_recorded: false, accountable: "policy move_vms_between_clusters v2, owner l2-engineer-1" }
    decisions: [D-029, D-050, D-079]

  L-5:
    title: An alert the check did not predict
    plant:
      slipped: { object: va-db-033, title: "VM waiting for resources", raised: "now - 4 days" }
      hidden_in_average: { instance: "scsi0:2 (transaction log disk)", metric: disk_latency_ms, peak: 38, vm_average: 4, red: 20 }
    expect: { slipped_alerts: 1, weekly_caught_by: hidden_in_average }
    note: "The VM-level latency average hid one disk at its limit. The weekly check reads each virtual disk."

  L-6:
    title: Quarter-end close explains rising load
    plant:
      calendar:
        - { kind: quarter_end_close, location: null, when: next_quarter_end, note: "Quarter-end close, all locations" }
        - { kind: payday, location: sg, when: next_25th, note: "Payday, Singapore" }
      finding: { object: VA-S-03, summary: "Load rising toward the quarter-end close", pillar: capacity }
    expect: { finding_explained_by: quarter_end_close, finding_sorted_last: true }

  L-7:
    title: London end-of-day batch ran 40 minutes longer; a datastore behind it is slowing
    objects: { datastore: LD-DS-03, location: ld }
    plant: { batch_overrun_minutes: 40, datastore_latency_trend: rising }
    expect: { finding: { verdict: present_health, severity: amber, pillar: performance } }
    note: "An insight before the batch window runs into the start of business (SP5 prevention window)."

  # ---------------------------------------------------------------- Weekly, monthly and inventory stories

  L-8:
    title: A snapshot a backup left behind grows every night
    objects: { datastore: SG-DS-11, vm: sg-app-301, cluster: SG-S-02 }
    plant:
      nightly_used_percent: [71.0, 72.4, 73.9, 75.3, 76.6, 78.1, 79.5]
      cause: "a snapshot created by the backup job 9 days ago, never removed; it grows with every write"
    expect: { weekly_kind: slow_drift, in_daily: false }
    note: "A day shows +1.4%. A week shows a straight line to full in about 2 weeks."

  L-9:
    title: One vCPU at its limit inside a quiet VM
    objects: { vm: sg-db-044, cluster: SG-G-01 }
    plant:
      hidden_in_average: { instance: "vCPU 0 of 8", metric: vcpu_usage_percent, peak: 97, vm_average: 14, red: 90 }
      cause: "a single-threaded process; more vCPUs will not help"
    expect: { weekly_kind: hidden_in_average }

  L-10:
    title: Three hosts behind their cluster on ESXi patches
    objects: { cluster: LD-B-01, hosts: [ld-esx-201, ld-esx-202, ld-esx-203] }
    plant: { drift: { setting: esxi_patch, behind_peers: 3, peers: 9 } }
    expect: { weekly_kind: configuration_drift }

  L-11:
    title: A CPU limit set directly in vCenter, outside any change window
    objects: { vm: ld-db-021, location: ld }
    plant:
      change: { id: chg-ld-db-021, at: "now - 2 days", type: limit_set, detail: "CPU limit 4,000 MHz", by: "admin@ld.acme.internal", via: vCenter, environment: production, class: gold }
    expect: { explanation: unexplained, listed_first: true }

  L-12:
    title: Last month's team decisions
    plant:
      decisions:
        - { id: d-cos-check, what: "Add a class-of-service check on VM placement", owner: l2-engineer-2, made: "now - 30 days", due: "now + 10 days" }
        - { id: d-snapshots, what: "Remove backup snapshots older than 3 days every night", owner: l2-engineer-1, made: "now - 30 days", due: "now - 5 days" }
        - { id: d-ld-logs, what: "Move London batch log disks to the all-flash datastore", owner: storage-lead, made: "now - 30 days", due: "now - 12 days", done: "now - 14 days", done_by: storage-lead }
    expect: { d-cos-check: open, d-snapshots: overdue, d-ld-logs: done }
    note: "d-snapshots overdue, and the snapshot story L-8 is the cost of it: the review sees both."

  # ---------------------------------------------------------------- Availability SLA stories (D-077)

  U-1:
    title: Virginia patching inside an approved change window does not count
    objects: { location: va, cluster: VA-G-05, vms: 6, class: gold, environment: production }
    plant:
      change_window: { id: chg-va-1042, source: itsm, change_ref: CHG0041042, approved: true, scope: [VA-G-05], starts: "now - 3 days", hours: 3 }
      downtime: { start_in_window_minutes: 30, minutes: 25 }
    expect:
      counted_minutes: 0
      actual_downtime_minutes_total: 150
      within_sla: true
    note: "Six Gold VMs rebooted for 25 minutes inside the approved window: Operational 100%, Actual below 100%."

  U-2:
    title: Two Tokyo Silver VMs crashed for 15 minutes outside any change window
    objects: { location: tk, cluster: TK-S-02, vms: [tk-app-208, tk-app-211], class: silver, environment: production }
    plant:
      downtime: { starts: "now - 2 days", minutes: 15, inside_change_window: false }
    expect:
      counted_minutes_each: 15
      within_sla: true
      card_status: amber
    note: "15 minutes is within Silver's 22.3-minute allowance for a 31-day month: the contract holds, the internal target (100%) does not."

  # ---------------------------------------------------------------- Capacity stories (D-053 step 4)

  C-2:
    title: Tokyo Gold has had most of its capacity unused for months
    objects: { cluster_group: TK-Gold }
    plant: { in_use_percent_now: { compute: 38, memory: 41, storage: 35 }, trend_run_out_days: 1400 }
    expect: { quadrant: waste }

  C-3:
    title: Tokyo's March year-end close
    objects: { cluster_group: TK-Silver, resource: memory }
    plant:
      last_year_close_uplift_percent_of_usable: 16
    expect:
      forecast_90d_sees_peak: false
      peak_warning: { resource: memory, month: 3 }
      purchase_decision_unchanged_by_peak: true
    note: >
      A 90-day forecast has never seen a March close; the 13-month forecast has (Capacity design, 3.5). The close
      week alone crosses usable capacity, and the trend does not. SP5: do not add hardware for a peak of a few
      days a year; borrow hosts, burst, or limit other work that week. So it is a peak warning, not a purchase.

  C-4:
    title: An OpenShift migration wave into Frankfurt Silver
    objects: { cluster_group: FR-Silver }
    plant:
      demand_register: { id: dr-ocp-wave-2, kind: migration, source: OpenShift, vms: 800, when: "now + 200 days", added: "now - 3 days", owner: "migration-team", memory_gb: 25600, compute_threads: 1600, storage_tb: 160 }
    expect: { run_out_on_or_before: "now + 200 days", register_owner_shown: true, week_shows_moved_earlier_because_of: dr-ocp-wave-2 }

  C-5:
    title: London's older hosts reach the end of depreciation
    objects: { location: ld }
    plant: { previous_generation_hosts: 90, depreciation_end_within_days: 365 }
    expect:
      what_if: "Replace 90 previous-generation hosts with 75 of the current standard"
      covers_next_year_growth: true
      licensed_cores_rise: true
    note: >
      75 current hosts give 9,600 threads and 57,600 GB against 7,200 and 46,080 from 90 old ones. That covers
      London's next year of growth (about 1,800 threads and 10,500 GB) in 15 fewer hosts. Licensed cores rise from
      3,600 to 4,800, because VCF is licensed per core (D-061): the what-if shows both sides (Capacity design, 3.9).

