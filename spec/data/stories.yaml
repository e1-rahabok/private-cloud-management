# Stories planted in the synthetic estate (design/synthetic-acme-data.md, section 5).
# Times are relative to "now" (D-067). Each story's expected results are tests in tests/.
# This file holds only the stories the Executive page needs (D-070, section 7).
# Other stories are added with their workspace.

version: 1

background:
  description: >
    Everything not in a story is mostly green (realism rule). No location other than the
    ones below has a decision date within 90 days. Up stays above target in all locations.
    Fast: every class group KPI is green, and Gold scores above Silver above Bronze (D-072).
  up.availability_percent: { estate: 99.97 }
  fast.class_group_kpi: { gold: 96.8, silver: 93.5, bronze: 88.2 }
  decision_dates_days_from_now: { va: 200, fr: 160, tk: 300, ld: 250 }

stories:

  C-1:
    title: Singapore Silver runs out of working memory
    objects: { cluster_group: SG-Silver, resource: memory }
    plant:
      run_out_date: "now + 150 days"
      in_next_round: true
    expect:
      capacity.decision_date: "now + 30 days"
      capacity.location_decision(sg): { date: "now + 30 days", resource: memory, in_plan: true, status: in_plan }
      capacity.estate_decision: { location: sg }
    decisions: [D-054]

  C-6:
    title: Reclaimable capacity in Singapore Silver
    objects: { cluster_group: SG-Silver }
    plant:
      powered_off_vms: 300
      idle_vms: 900
      oversized_large_vms: 60
      reclaim_moves_decision_date_to: "now + 70 days"
      next_round_cost_for_group: 1800000
    expect:
      value.cost_avoidable_next_round: 1800000
    note: >
      Reclaiming moves SG-Silver's decision date past the round (now + 42 days), so the round's
      cost for that group could be avoided (D-060). Until it is done, C-1 stays in the plan.
    decisions: [D-060]

  E-4:
    title: Cost avoided earlier this year
    objects: { cluster_group: TK-Silver }
    plant:
      deferred_purchase:
        when: "now - 150 days"
        value_at_today_price: 1200000
    expect:
      value.cost_avoided_ytd: 1200000
    decisions: [D-060]

  N-4:
    title: SSH left on in London, outside the maintenance window
    objects: { location: ld, hosts: 3, production_vms_on_hosts: 72 }
    plant:
      ssh_enabled_since: "now - 8 hours"
      inside_maintenance_window: false
    expect:
      safe.ssh_or_shell_enabled: 3
      safe.vms_below_sla: 72
    note: >
      8 hours of unsecured time is far beyond the 21.6 minutes a month that 99.95% allows, so the 72
      production VMs on those hosts are below the Security SLA for the month (D-073).
    decisions: [D-049, D-073]

  E-1:
    title: Up and fast are fine; safe is red because the contract broke for 72 VMs
    depends_on: [N-4]
    plant:
      certificates_expiring:
        - { component: vcenter-fr-01, expires: "now + 21 days" }
        - { component: nsx-manager-sg-01, expires: "now + 26 days" }
      certificates_expired: 0
      lockdown_off: 0
      root_logins_open: 0
    expect:
      up: { status: green, headline: 99.97 }
      fast: { status: green, headline_between: [88.2, 96.8], order_kept: true }
      safe: { status: red, vms_below_sla: 72, ksi_between: [99.95, 100.0], risk_certificates: 2, ssh_or_shell_enabled: 3 }
    note: >
      The estate KSI stays above 99.95%, yet the card is red: the rule is decided per VM (D-073). The 2
      certificates are a risk, not unsecured time, so they do not count against the SLA.
    decisions: [D-035, D-072, D-073]

  E-2:
    title: Singapore's date is already in the plan
    depends_on: [C-1]
    expect:
      headline_chip: in_plan
      headline_text_contains: ["working memory", "Singapore"]
    decisions: [D-054]

  E-3:
    title: Frankfurt site recovery not fully tested
    objects: { recovery_plan: rp-fr }
    plant:
      last_test: "now - 120 days"
      recovery_minutes: 22
      protected_vms: 1800
      vms_in_last_test: 1580
      other_plans: { last_test: "now - 60 days", recovery_minutes: 18, share_tested_percent: 99 }
    expect:
      recovery.site_recovery(fr): { status: amber, share_tested_percent: 87.8 }
      card_status: amber
    decisions: [D-059]

  E-5:
    title: Goals, one at risk
    plant:
      g-alerts: { projected_year_end: 180 }
      g-versions: { projected_year_end: 88 }
      g-found-first: { projected_year_end: 64 }
    expect:
      g-alerts: on_track
      g-versions: at_risk
      g-found-first: on_track
    decisions: [D-043]

  E-6:
    title: Delivery speed
    plant:
      delivery_hours_last_30d: 3.8
      delivery_hours_year_ago: 264
    expect:
      speed.delivery_time: { now: 3.8, year_ago: 264 }

  E-7:
    title: Europe's VCF Operations goes stale
    enabled_by_default: false
    objects: { vcf_operations_instance: vcf-ops-emea }
    plant:
      last_successful_read: "now - 20 minutes"
      collection_cycle_minutes: 5
    expect:
      locations: { fr: { stale: true }, ld: { stale: true } }
      header_text_contains: "Some data is out of date"
    note: >
      Off by default, so the other stories read Frankfurt and London normally. Tests and
      demos switch it on. Same failure as NOC story N-2. On the Executive page, Frankfurt and London towers turn
      grey with "No data"; they are never drawn as healthy (D-041).
    decisions: [D-041]

  # ---------------------------------------------------------------- NOC stories (D-053 step 2)

  N-1:
    title: A Bronze batch VM in a Silver cluster hurts its neighbours in Frankfurt
    objects:
      cluster: FR-S-02
      villain: { vm: fr-bat-017, class: bronze, environment: production }
      victims: [fr-app-101, fr-app-114, fr-db-022, fr-app-131]
    plant:
      cluster_performance:
        before: { value: 94, until: "now - 20 minutes" }
        now: 22
        shape: linear fall
      villain_score: 88
      victim_scores: [31, 36, 41, 44]
      alerts:
        - { object: FR-S-02, object_type: cluster, severity: red, title: "Cluster not serving its VMs well", raised: "now - 12 minutes" }
        - { object: fr-app-101, object_type: vm, parent: FR-S-02, severity: red, title: "VM waiting for resources", raised: "now - 11 minutes" }
        - { object: fr-app-114, object_type: vm, parent: FR-S-02, severity: red, title: "VM waiting for resources", raised: "now - 10 minutes" }
        - { object: fr-db-022, object_type: vm, parent: FR-S-02, severity: red, title: "VM waiting for resources", raised: "now - 9 minutes" }
    expect:
      wall.fast.status: red
      wall.pins_contains: fast
      incident: { root_object: FR-S-02, alerts: 4, severity: red, sop: sop-cluster-contention, escalation_route: platform }
      sop.limit_allowed: false
      sop.limit_refusal: "Production VM: escalate instead"
      sop.stop_provisioning_allowed: true
    note: >
      The villain is production, so the SOP escalates to L2 instead of limiting it (D-040). Stopping
      provisioning on the cluster is still allowed: it touches no running VM.
    decisions: [D-040, D-041, D-069]

  N-2:
    title: Europe's VCF Operations stops answering
    enabled_by_default: false
    same_as: E-7
    expect:
      wall.tiles: { fr: no_data, ld: no_data }
      incident: { root_object: vcf-ops-emea, severity: red, sop: sop-no-data, escalation_route: platform }
    note: "A grey screen is itself escalated (D-041). Frankfurt's contention (N-1) is hidden while Europe is grey: correct, the wall shows only what it knows."
    decisions: [D-041]

  N-3:
    title: 40 VMs deleted in Tokyo with no change planned
    objects: { location: tk }
    plant:
      deleted_last_hour: 40
      deleted_within: "now - 10 minutes"
      expected_deleted: 2
      planned: false
    expect:
      wall.changed.tk.deleted.status: red
      incident: { root_object: tk, kind: wall_finding, severity: red, escalation_route: platform }
    note: >
      Inventory changes raise no alert (SP5). But every red on the wall must be something L1 can acknowledge
      (D-041), so PCM opens a wall-finding incident for it (D-075).
    decisions: [D-036, D-041, D-075]

  O-1:
    title: Datastore space running low in London
    objects: { datastore: LD-DS-07, location: ld }
    plant:
      alerts:
        - { object: LD-DS-07, object_type: datastore, severity: orange, title: "Datastore space running low", raised: "now - 95 minutes" }
    expect:
      incident: { root_object: LD-DS-07, severity: orange, sop: sop-datastore-space, escalation_route: storage }
      wall.pin_effect: none
    note: "Orange is end-of-day work. It appears in the alert list but does not stop the wall rotation."
    decisions: [D-040]

  # ---------------------------------------------------------------- L2 stories (D-053 step 3)

  L-1:
    title: The Frankfurt escalation arrives at L2 complete, and closes only with a detection decision
    depends_on: [N-1]
    flow: "NOC escalates inc-fr-s-02 (NOC page or API), then L2 reads it on /l2/escalations"
    expect:
      escalation: { id: inc-fr-s-02, evidence_has: [sop_steps, villains, victims, l1_actions], villain_counters_shown: true }
      close_without_detection: 400
      close_complete: 200
    note: "L2 sees raw counters of the villain and victims; L1 did not (NOC vocabulary)."
    decisions: [D-040, D-050]

  L-2:
    title: An application owner says SG-APP-117 is slow; the cause is inside the Guest OS
    objects: { vm: sg-app-117, cluster: SG-S-07, host: sg-esx-088 }
    plant:
      vm: { cpu_ready_percent: 0.6, co_stop_percent: 0.1, memory_wait_percent: 0.0, disk_latency_ms: 3, vm_performance: 96 }
      guest_os: { run_queue_per_vcpu: 6.5, context_switches_per_s: 41000, paging_per_s: 12, guest_os_performance: 38 }
    expect:
      first_failing_step: null
      realm_verdict: guest_os
    decisions: [D-038]

  L-3:
    title: One host in VA-G-05 drifted from its peers
    objects: { host: va-esx-142, cluster: VA-G-05 }
    plant:
      drift:
        - { setting: ntp_server, actual: "10.20.1.9", standard: "ntp.acme.internal" }
        - { setting: syslog_target, actual: "(none)", standard: "loginsight.acme.internal" }
    expect: { group: correct_it, findings: 2 }

  L-4:
    title: A VM move earns automation
    plant:
      proposal: { id: p-move-sg-s-04, action_type: move_vms_between_clusters, from: SG-S-04, to: SG-S-06, vms: 6 }
      record: { action_type: move_vms_between_clusters, approvals: 23, rollbacks: 0, tier: approval }
    expect: { promotion_offered: true, promote_without_reason: 400, promote_with_reason: 200, tier_after: automatic }
    decisions: [D-029, D-050]

  L-5:
    title: An alert the check did not predict
    plant:
      slipped: { object: va-db-033, title: "VM waiting for resources", raised: "now - 4 days" }
    expect: { slipped_alerts: 1 }

  L-6:
    title: Quarter-end close explains rising load
    plant:
      calendar:
        - { kind: quarter_end_close, location: null, when: next_quarter_end, note: "Quarter-end close, all locations" }
        - { kind: payday, location: sg, when: next_25th, note: "Payday, Singapore" }
      finding: { object: VA-S-03, summary: "Load rising toward the quarter-end close", pillar: capacity }
    expect: { finding_explained_by: quarter_end_close, finding_sorted_last: true }

  L-7:
    title: London end-of-day batch ran 40 minutes longer; a datastore behind it is slowing
    objects: { datastore: LD-DS-03, location: ld }
    plant: { batch_overrun_minutes: 40, datastore_latency_trend: rising }
    expect: { finding: { verdict: present_health, severity: amber, pillar: performance } }
    note: "An insight before the batch window runs into the start of business (SP5 prevention window)."
