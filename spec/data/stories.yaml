    plant: { in_use_percent_now: { compute: 38, memory: 41, storage: 35 }, trend_run_out_days: 1400 }
    expect: { quadrant: waste }

  C-3:
    title: Tokyo's March year-end close
    objects: { cluster_group: TK-Silver, resource: memory }
    plant:
      last_year_close_uplift_percent_of_usable: 16
    expect:
      forecast_90d_sees_peak: false
      peak_warning: { resource: memory, month: 3 }
      purchase_decision_unchanged_by_peak: true
    note: >
      A 90-day forecast has never seen a March close; the 13-month forecast has (Capacity design, 3.5). The close
      week alone crosses usable capacity, and the trend does not. SP5: do not add hardware for a peak of a few
      days a year; borrow hosts, burst, or limit other work that week. So it is a peak warning, not a purchase.

  C-4:
    title: An OpenShift migration wave into Frankfurt Silver
    objects: { cluster_group: FR-Silver }
    plant:
      demand_register: { id: dr-ocp-wave-2, kind: migration, source: OpenShift, vms: 800, when: "now + 200 days", added: "now - 3 days", owner: "migration-team", memory_gb: 25600, compute_threads: 1600, storage_tb: 160 }
    expect: { run_out_on_or_before: "now + 200 days", register_owner_shown: true, week_shows_moved_earlier_because_of: dr-ocp-wave-2 }

  C-5:
    title: London's older hosts reach the end of depreciation
    objects: { location: ld }
    plant: { previous_generation_hosts: 90, depreciation_end_within_days: 365 }
    expect:
      what_if: "Replace 90 previous-generation hosts with 75 of the current standard"
      covers_next_year_growth: true
      licensed_cores_rise: true
    note: >
      75 current hosts give 9,600 threads and 57,600 GB against 7,200 and 46,080 from 90 old ones. That covers
      London's next year of growth (about 1,800 threads and 10,500 GB) in 15 fewer hosts. Licensed cores rise from
      3,600 to 4,800, because VCF is licensed per core (D-061): the what-if shows both sides (Capacity design, 3.9).

