# PCM object model, part needed by the Executive workspace.
# VMware objects, not a vendor-neutral model (PCM core, 3.1).
# Each workspace adds the objects it needs when its turn comes (D-053, D-070 section 7).

version: 1

objects:

  region:
    description: A group of locations served by one VCF Operations instance.
    fields:
      id: { type: string, example: apj }
      name: { type: string, example: Asia Pacific }
      vcf_operations_instance: { type: ref, to: vcf_operations_instance }
    decisions: [D-009, D-064]

  location:
    description: A physical site. The unit the Executive sees (Executive design, 4.9).
    fields:
      id: { type: string, example: sg }
      name: { type: string, example: Singapore }
      region: { type: ref, to: region }
      time_zone: { type: string, example: Asia/Singapore }
      financial_year_end_month: { type: integer, example: 12, note: "Tokyo is 3 (D-065)" }
    decisions: [D-009, D-065]

  vcf_operations_instance:
    description: One VCF Operations. PCM reads through it and has no collectors of its own.
    fields:
      id: { type: string }
      region: { type: ref, to: region }
      last_successful_read: { type: datetime }
    decisions: [D-064]

  vcf_instance:
    description: One VCF instance. One per location in the ACME estate.
    fields:
      id: { type: string }
      location: { type: ref, to: location }
    decisions: [D-009]

  cluster:
    description: A vSphere cluster. The unit of capacity (Capacity design, 3.1).
    fields:
      id: { type: string, example: SG-S-04, note: "location - class initial - number" }
      location: { type: ref, to: location }
      class_of_service: { type: enum, values: [gold, silver, bronze, mixed, management, edge] }
      cluster_group: { type: ref, to: cluster_group, optional: true, note: "Management and edge clusters have no group" }
      hosts: { type: list, of: host }
    decisions: [D-012]

  cluster_group:
    description: >
      Clusters in one location with the same class of service, which can take each
      other's workload. Capacity decisions are made per group (Capacity design, 3.1).
    fields:
      id: { type: string, example: SG-Silver }
      location: { type: ref, to: location }
      class_of_service: { type: enum, values: [gold, silver, bronze] }
      clusters: { type: list, of: cluster }
    decisions: [D-054]

  host:
    description: An ESXi host.
    fields:
      id: { type: string }
      cluster: { type: ref, to: cluster }
      generation: { type: enum, values: [current, previous] }
      cores: { type: integer, note: "Physical cores. Used for licensing (D-061)" }
      threads: { type: integer, note: "Physical threads. Unit of CPU capacity and cost (D-061)" }
      memory_gb: { type: integer, note: "DRAM" }
      depreciation_end: { type: date }
    decisions: [D-061]

  datastore:
    description: A datastore, including vSAN. Space as seen by vSphere (D-057).
    fields:
      id: { type: string }
      location: { type: ref, to: location }
      capacity_tb: { type: number }

  vm:
    description: A virtual machine. The Executive never sees a single VM (Executive design, section 5).
    fields:
      id: { type: string }
      cluster: { type: ref, to: cluster }
      environment: { type: enum, values: [production, non_production] }
      protected_by: { type: list, of: recovery_plan, optional: true }

  recovery_plan:
    description: A site recovery plan in VMware Live Site Recovery (D-059).
    fields:
      id: { type: string }
      protected_location: { type: ref, to: location }
      recovery_location: { type: ref, to: location }
      target_recovery_minutes: { type: integer }
    decisions: [D-059]

  recovery_test:
    description: One test run of a recovery plan.
    fields:
      plan: { type: ref, to: recovery_plan }
      run_at: { type: datetime }
      recovery_minutes: { type: integer }
      vms_in_test: { type: list, of: vm, note: "The VMs actually recovered in this test" }
    decisions: [D-059]

  goal:
    description: A goal for the year, held in PCM and reviewed monthly (D-043).
    fields:
      id: { type: string }
      title: { type: string, note: "Plain words, Executive vocabulary (D-051)" }
      metric: { type: ref, to: catalog_entry }
      target: { type: number }
      direction: { type: enum, values: [at_most, at_least] }
      year: { type: integer }
    decisions: [D-043]

  procurement_round:
    description: One of the twice-yearly purchase rounds (Capacity design, 3.8).
    fields:
      id: { type: string }
      closes_on: { type: date }
      cluster_groups_in_plan: { type: list, of: cluster_group }
    decisions: [D-054, D-055]

  # ---------------------------------------------------------------- Added for the NOC workspace (D-053 step 2)

  maintenance_window:
    description: An agreed change window per location, from the business calendar (L2 design, 3.6). Unsecured time inside it does not count (D-073).
    fields:
      location: { type: ref, to: location }
      starts_at: { type: datetime }
      ends_at: { type: datetime }

  shift:
    description: One of three NOC shifts (D-031). Times are in the region's local time.
    fields:
      region: { type: ref, to: region }
      name: { type: enum, values: [day, evening, night] }
      starts: { type: time }
      ends: { type: time }
    decisions: [D-031]

  vm_change_event:
    description: One change to a VM, for "What changed?". Planned changes from the business calendar are marked planned.
    fields:
      at: { type: datetime }
      vm: { type: ref, to: vm }
      location: { type: ref, to: location }
      type: { type: enum, values: [created, deleted, powered_off, moved, resized] }
      planned: { type: boolean }

  finding:
    description: A failed check now, for "Is it up?", "Is it safe?" or "Is it set right?".
    fields:
      id: { type: string }
      screen: { type: enum, values: [up, safe, set_right] }
      check: { type: string, example: ssh_or_shell_enabled }
      object: { type: string, example: "ld-esx-031" }
      location: { type: ref, to: location }
      since: { type: datetime }

  alert:
    description: >
      An urgent issue on one object. Only red (act within 1 to 2 hours) and orange (act by end of day)
      reach the NOC; yellow is not an alert (NOC design, 3.4).
    fields:
      id: { type: string }
      object: { type: string }
      object_type: { type: enum, values: [vm, host, cluster, datastore, vcf_operations_instance] }
      parent: { type: string, optional: true, note: "The related object used for grouping (D-069)" }
      severity: { type: enum, values: [red, orange] }
      title: { type: string }
      raised_at: { type: datetime }
      incident: { type: ref, to: incident }

  incident:
    description: Alerts grouped by object relationship and time, by fixed rules (D-069). Named after the parent object.
    fields:
      id: { type: string }
      root_object: { type: string }
      root_object_type: { type: string }
      location: { type: ref, to: location }
      severity: { type: enum, values: [red, orange], note: "The highest of its alerts" }
      sop: { type: ref, to: sop }
      state: { type: enum, values: [new, acknowledged, escalated, closed] }
      acknowledged_by: { type: string, optional: true }
      escalated_to: { type: enum, values: [platform, storage, network], optional: true }
      root_cause: { type: string, optional: true, note: "Required to close (D-040)" }
      alerts: { type: list, of: alert }
    decisions: [D-040, D-069]

  sop:
    description: A standard operating procedure. Its steps drive the alert page (NOC design, 3.5).
    fields:
      id: { type: string }
      title: { type: string }
      steps: { type: list, of: sop_step }

  sop_step:
    fields:
      kind: { type: enum, values: [diagnosis, action, escalate, verify] }
      text: { type: string }
      check: { type: string, optional: true, note: "Catalog entry read live for a diagnosis or verify step" }
      action: { type: ref, to: action_type, optional: true }
      when: { type: string, optional: true, note: "Condition on earlier steps, e.g. villain.environment == non_production" }

  action_type:
    description: An action L1 may run through PCM (D-040), with its tier (D-029).
    fields:
      id: { type: enum, values: [acknowledge, annotate, escalate, close, stop_provisioning, reopen_provisioning, time_boxed_limit, restart_vm] }
      tier: { type: enum, values: [automatic, approval, never] }
      allowed_for: { type: list, of: string, note: "Role and target conditions" }

  action_record:
    description: One entry of the action history (D-063). Both identity fields (D-050).
    fields:
      at: { type: datetime }
      action: { type: ref, to: action_type }
      target: { type: string }
      actor_agent: { type: string, optional: true, note: "Agent E2's ID when it acted" }
      actor_human: { type: string, note: "The person accountable" }
      reason: { type: string }
      before: { type: string }
      after: { type: string }
      expires_at: { type: datetime, optional: true }
    decisions: [D-050, D-063]
